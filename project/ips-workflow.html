    const bucketRetPct = `(${bucketRefs[g.bucket].retRef}/100)`;
    setCell(ws4c, rr, 7,
      `=IF(${encCell(rr,4)}>=${encCell(rr,3)},${encCell(rr,2)},${encCell(rr,2)}+NPER(${bucketRetPct},-${lastContribRef},-${encCell(rr,4)},${encCell(rr,3)}))`,
      {z:'0.0'});
  });
  ws4c['!cols'] = [{wch:26},{wch:16},{wch:16},{wch:16},{wch:16},{wch:16},{wch:14},{wch:14},{wch:16},{wch:16}];
  XLSX.utils.book_append_sheet(wb, ws4c, 'Goal Funding Projection');

  /* ---------- Sheet 4d: Optimization Comparison (Equal / Sharpe / Calmar per bucket) ---------- */
  const ws4d = {};
  setCell(ws4d, 0, 0, "Equity Sleeve Optimization — Equal vs Sharpe-Optimised vs Calmar-Optimised");
  setCell(ws4d, 1, 0, "Equity sleeve of each bucket independently optimised via 8,000-trial random weight search (cap 35%/fund, floor 5%/fund). Non-equity sleeves (Debt, Gold, Cash, Alt) are fixed as per allocation; only equity fund weights change across columns. Calmar-optimised maximises return per unit of max drawdown — better for loss-averse clients than Sharpe.");
  let rOpt = 3;
  Object.keys(client.solution.buckets).forEach(bKey => {
    const bucket = client.solution.buckets[bKey];
    const eqPct = bucket.allocation.filter(r=>r.asset==='Equity').reduce((s,r)=>s+allocRowPct(r),0);
    if (eqPct < 0.01) return; // skip non-equity buckets

    const goalNames = bucket.goals.map(g=>`${g.name} (${inr(g.amount)}, ${g.years}y)`).join('; ');
    setCell(ws4d, rOpt, 0, BUCKET_LABEL[bKey] + ' — ' + goalNames); rOpt++;
    const rebTrigger = bucket.rebalanceTrigger || '±5% drift threshold';
    setCell(ws4d, rOpt, 0, 'Rebalancing trigger:'); setCell(ws4d, rOpt, 1, rebTrigger); rOpt++;

    // Compute all three
    const ef = bucketFundWeights(bucket,'equal').filter(f=>f.weight>0.001);
    const sf = bucketFundWeights(bucket,'sharpe').filter(f=>f.weight>0.001);
    const cf = bucketFundWeights(bucket,'calmar').filter(f=>f.weight>0.001);
    const es = portfolioStatsJS(ef), ss = portfolioStatsJS(sf), cs = portfolioStatsJS(cf);
    const allNames = [...new Set([...ef,...sf,...cf].map(f=>f.name))];

    ['Fund','Equal Weight (%)','Sharpe-Opt Weight (%)','Calmar-Opt Weight (%)'].forEach((h,i)=>setCell(ws4d,rOpt,i,h));
    rOpt++;
    allNames.forEach(name => {
      const e = ef.find(f=>f.name===name), s = sf.find(f=>f.name===name), c = cf.find(f=>f.name===name);
      setCell(ws4d, rOpt, 0, name);
      setCell(ws4d, rOpt, 1, e ? e.weight : 0, {z: PCT1});
      setCell(ws4d, rOpt, 2, s ? s.weight : 0, {z: PCT1});
      setCell(ws4d, rOpt, 3, c ? c.weight : 0, {z: PCT1});
      rOpt++;
    });
    const metrics = [
      ['Bucket Return (%)', es.ret, ss.ret, cs.ret, CUR2],
      ['Bucket SD (%)',     es.sd,  ss.sd,  cs.sd,  CUR2],
      ['Est. Max Drawdown (%)', es.maxDD*100, ss.maxDD*100, cs.maxDD*100, CUR2],
      ['Sharpe Ratio',     es.sharpe, ss.sharpe, cs.sharpe, '0.00'],
      ['Calmar Ratio',     es.calmar, ss.calmar,  cs.calmar,  '0.00'],
    ];
    metrics.forEach(([lbl, ev, sv, cv, z]) => {
      setCell(ws4d, rOpt, 0, lbl);
      setCell(ws4d, rOpt, 1, ev, {z});
      setCell(ws4d, rOpt, 2, sv, {z});
      setCell(ws4d, rOpt, 3, cv, {z});
      rOpt++;
    });
    setCell(ws4d, rOpt, 0, 'Note: Sharpe-opt improves return per unit of SD; Calmar-opt reduces max drawdown risk while maintaining return. Trailing 3Y returns may overfit recent winners — advisor should review before adopting.'); rOpt+=2;
  });
  ws4d['!cols'] = [{wch:40},{wch:16},{wch:18},{wch:18}];
  XLSX.utils.book_append_sheet(wb, ws4d, 'Optimization Comparison');

  /* ---------- Sheet 5: Historical VaR & Backtest ---------- */
  const ws5 = {};
  setCell(ws5, 0, 0, "Historical VaR & Backtest");
  setCell(ws5, 1, 0, "250 real daily returns (Sep'24-Sep'25) for Nifty 50 & Gold ETF, sorted smallest-to-largest, 95% VaR read at the 5%-of-250 position — same method as the advisor's own reference sheets. Other categories use the parametric z-score method (Annual SD x NORM.S.INV(5%)).");
  setCell(ws5, 3, 0, "#"); setCell(ws5, 3, 1, "Nifty 50 Daily Return"); setCell(ws5, 3, 2, "Gold ETF Daily Return");
  const DAILY_FIRST = 4;
  NIFTY_DAILY.forEach((v, i) => {
    setCell(ws5, DAILY_FIRST+i, 0, i+1);
    setCell(ws5, DAILY_FIRST+i, 1, v, {z:'0.00%'});
    setCell(ws5, DAILY_FIRST+i, 2, GOLD_DAILY[i], {z:'0.00%'});
  });
  const DAILY_LAST = DAILY_FIRST + NIFTY_DAILY.length - 1;
  let sc5 = 4;
  setCell(ws5, 3, sc5, "Historical VaR Summary (real data)");
  let rr5 = 4;
  setCell(ws5, rr5, sc5, "Trading days (n)");
  setCell(ws5, rr5, sc5+2, `=COUNT(${encCell(DAILY_FIRST,1)}:${encCell(DAILY_LAST,1)})`, {z:'0'}); rr5++;
  setCell(ws5, rr5, sc5, "5% rank position");
  setCell(ws5, rr5, sc5+2, `=0.05*${encCell(rr5-1,sc5+2)}`, {z:'0.0'}); const rankRef5 = encCell(rr5,sc5+2); rr5++;
  setCell(ws5, rr5, sc5, "Nifty 50 — 95% Historical VaR (1-day)");
  setCell(ws5, rr5, sc5+2, `=SMALL(${encCell(DAILY_FIRST,1)}:${encCell(DAILY_LAST,1)},ROUND(${rankRef5},0))`, {z:'0.00%'}); rr5++;
  setCell(ws5, rr5, sc5, "Gold ETF — 95% Historical VaR (1-day)");
  setCell(ws5, rr5, sc5+2, `=SMALL(${encCell(DAILY_FIRST,2)}:${encCell(DAILY_LAST,2)},ROUND(${rankRef5},0))`, {z:'0.00%'}); rr5++;
  setCell(ws5, rr5, sc5, "Nifty 50 — Annualised SD (real data, cross-check)");
  setCell(ws5, rr5, sc5+2, `=_xlfn.STDEV.P(${encCell(DAILY_FIRST,1)}:${encCell(DAILY_LAST,1)})*SQRT(252)`, {z:'0.00%'}); rr5++;
  setCell(ws5, rr5, sc5, "Gold ETF — Annualised SD (real data, cross-check)");
  setCell(ws5, rr5, sc5+2, `=_xlfn.STDEV.P(${encCell(DAILY_FIRST,2)}:${encCell(DAILY_LAST,2)})*SQRT(252)`, {z:'0.00%'}); rr5+=2;
  setCell(ws5, rr5, sc5, "Parametric (z-score) VaR by Category"); rr5++;
  ["Category","Annual SD (%)","95% z-score","Annual Parametric VaR (%)"].forEach((h,i)=>setCell(ws5,rr5,sc5+i,h)); rr5++;
  const CAT_SD_TYPICAL2 = {N50:12.5,N500:15.9,MA:7.5,GOLD:12.2,SPX:16.65,THM:17.5,DEBT:2.14,CASH:0.40,AIF:11.5};
  CATS2.forEach(cat => {
    setCell(ws5, rr5, sc5, CAT_LABEL2[cat]);
    setCell(ws5, rr5, sc5+1, CAT_SD_TYPICAL2[cat], {z:CUR2});
    setCell(ws5, rr5, sc5+2, "=_xlfn.NORM.S.INV(0.05)", {z:'0.000'});
    setCell(ws5, rr5, sc5+3, `=${encCell(rr5,sc5+1)}*${encCell(rr5,sc5+2)}`, {z:CUR2});
    rr5++;
  });
  rr5++;
  setCell(ws5, rr5, sc5, "Consolidated Portfolio — Parametric 95% Annual VaR");
  setCell(ws5, rr5, sc5+2, `=${PORT_RET_FINAL}+_xlfn.NORM.S.INV(0.05)*${PORT_SD_FINAL}`, {z:CUR2});
  ws5['!cols'] = [{wch:6},{wch:16},{wch:16},{wch:6},{wch:38},{wch:12},{wch:14},{wch:16}];
  XLSX.utils.book_append_sheet(wb, ws5, 'Historical VaR & Backtest');

  /* ---------- Sheet 6: Stress Test ---------- */
  const ws6 = {};
  setCell(ws6, 0, 0, "Stress Test — Historical Crisis Scenarios");
  setCell(ws6, 1, 0, "Covid Crash figures from the advisor's own reference sheets; 2008 GFC and 2022 Rate-Hike Selloff added using well-documented category-level Indian-market drawdowns, applied to this client's own fund weights.");
  const STRESS2 = {
    "Covid Crash (Feb-Mar 2020)": {N50:-0.38,N500:-0.39,MA:-0.24,GOLD:0.07,SPX:-0.20,THM:-0.40,DEBT:0.017,CASH:0.01,AIF:-0.18},
    "2008 Global Financial Crisis": {N50:-0.60,N500:-0.61,MA:-0.35,GOLD:0.25,SPX:-0.38,THM:-0.65,DEBT:0.05,CASH:0.07,AIF:-0.30},
    "2022 Rate-Hike Selloff": {N50:-0.15,N500:-0.17,MA:-0.08,GOLD:0.02,SPX:-0.19,THM:-0.20,DEBT:-0.02,CASH:0.04,AIF:-0.08},
  };
  let r6 = 3;
  Object.entries(STRESS2).forEach(([scenario, impacts]) => {
    setCell(ws6, r6, 0, scenario); r6++;
    ["Fund Name","Category","Weight %","Category Fall %","Weighted Fall"].forEach((h,i)=>setCell(ws6,r6,i,h)); r6++;
    const first6 = r6;
    funds.forEach((f, i) => {
      const pcRow = PC_WEIGHT_ROW0 + i;
      setCell(ws6, r6, 0, f.name);
      setCell(ws6, r6, 1, f.category);
      setCell(ws6, r6, 2, `='Portfolio Construction'!${encCell(pcRow,2)}`, {z: PCT1});
      setCell(ws6, r6, 3, impacts[f.bmcat], {z: PCT1});
      setCell(ws6, r6, 4, `=${encCell(r6,2)}*${encCell(r6,3)}`, {z: PCT1});
      r6++;
    });
    const last6 = r6 - 1;
    setCell(ws6, r6, 0, "PORTFOLIO FALL (weighted)");
    setCell(ws6, r6, 4, `=SUM(${encCell(first6,4)}:${encCell(last6,4)})`, {z: PCT1});
    r6++;
    setCell(ws6, r6, 0, "If 100% invested in Nifty 50 instead");
    setCell(ws6, r6, 4, impacts.N50, {z: PCT1});
    r6 += 3;
  });
  ws6['!cols'] = [{wch:38},{wch:14},{wch:10},{wch:14},{wch:14}];
  XLSX.utils.book_append_sheet(wb, ws6, 'Stress Test');

  /* ---------- Sheet 7: Scenario Test ---------- */
  const ws7 = {};
  setCell(ws7, 0, 0, "Scenario Test — Forward-Looking Hypotheticals");
  setCell(ws7, 1, 0, "Illustrative 'what-if' assumptions about the next 12 months — not predictions.");
  const SCEN2 = {
    "Sharp RBI Rate Cut (-150bps)": {N50:0.12,N500:0.13,MA:0.09,GOLD:0.05,SPX:0.03,THM:0.14,DEBT:0.09,CASH:0.065,AIF:0.10},
    "Stagflation (high inflation, low growth)": {N50:-0.10,N500:-0.12,MA:-0.03,GOLD:0.18,SPX:-0.08,THM:-0.15,DEBT:-0.03,CASH:0.06,AIF:-0.05},
    "Global Recession / Hard Landing": {N50:-0.22,N500:-0.24,MA:-0.10,GOLD:0.10,SPX:-0.25,THM:-0.28,DEBT:0.04,CASH:0.06,AIF:-0.15},
    "Strong Bull Run (re-rating)": {N50:0.28,N500:0.32,MA:0.20,GOLD:-0.03,SPX:0.18,THM:0.35,DEBT:0.055,CASH:0.065,AIF:0.22},
  };
  let r7 = 3;
  Object.entries(SCEN2).forEach(([scenario, impacts]) => {
    setCell(ws7, r7, 0, scenario); r7++;
    ["Fund Name","Category","Weight %","Assumed 1-Yr Impact %","Weighted Contribution"].forEach((h,i)=>setCell(ws7,r7,i,h)); r7++;
    const first7 = r7;
    funds.forEach((f, i) => {
      const pcRow = PC_WEIGHT_ROW0 + i;
      setCell(ws7, r7, 0, f.name);
      setCell(ws7, r7, 1, f.category);
      setCell(ws7, r7, 2, `='Portfolio Construction'!${encCell(pcRow,2)}`, {z: PCT1});
      setCell(ws7, r7, 3, impacts[f.bmcat], {z: PCT1});
      setCell(ws7, r7, 4, `=${encCell(r7,2)}*${encCell(r7,3)}`, {z: PCT1});
      r7++;
    });
    const last7 = r7 - 1;
    setCell(ws7, r7, 0, "PORTFOLIO IMPACT (weighted)");
    setCell(ws7, r7, 4, `=SUM(${encCell(first7,4)}:${encCell(last7,4)})`, {z: PCT1});
    r7 += 3;
  });
  ws7['!cols'] = [{wch:38},{wch:14},{wch:10},{wch:16},{wch:16}];
  XLSX.utils.book_append_sheet(wb, ws7, 'Scenario Test');

  /* ---------- Sheet 8: Monte Carlo Simulation ---------- */
  const ws8 = {};
  setCell(ws8, 0, 0, "Monte Carlo Simulation — " + client.name + "'s Consolidated Portfolio");
  setCell(ws8, 1, 0, "Each cell chains forward: Year N wealth = Year N-1 wealth x (1 + NORM.INV(RAND(), Portfolio Return, Portfolio SD)). The diversification benefit is already built into the Portfolio SD used here (from the covariance calc), so this simulates the portfolio's own aggregate path rather than re-simulating all funds every trial. Every cell is a live formula — press F9 to redraw.");
  const N_TRIALS2 = 200, N_YEARS2 = 12;
  setCell(ws8, 3, 0, "Portfolio Mean Return (%)"); setCell(ws8, 3, 1, `=${PORT_RET_FINAL}`, {z:CUR2});
  const MC_MEAN = encCell(3,1);
  setCell(ws8, 4, 0, "Portfolio SD (%)"); setCell(ws8, 4, 1, `=${PORT_SD_FINAL}`, {z:CUR2});
  const MC_SD = encCell(4,1);
  setCell(ws8, 5, 0, "Horizon (years)"); setCell(ws8, 5, 1, N_YEARS2);
  setCell(ws8, 6, 0, "Number of Trials"); setCell(ws8, 6, 1, N_TRIALS2);
  const gridHdr = 8;
  setCell(ws8, gridHdr, 0, "Trial #");
  for (let y=1; y<=N_YEARS2; y++) setCell(ws8, gridHdr, y, `Yr ${y} Cum. Wealth`);
  const gridFirst = gridHdr + 1;
  for (let t=0; t<N_TRIALS2; t++) {
    const r = gridFirst + t;
    setCell(ws8, r, 0, t+1);
    for (let y=1; y<=N_YEARS2; y++) {
      const prevRef = y === 1 ? "1" : encCell(r, y-1);
      setCell(ws8, r, y, `=${prevRef}*(1+_xlfn.NORM.INV(RAND(),${MC_MEAN},${MC_SD})/100)`, {z:'0.00'});
    }
  }
  const gridLast = gridFirst + N_TRIALS2 - 1;
  const endCol = N_YEARS2;
  const endColLetter = encCol(endCol);
  const summaryCol = endCol + 2;
  setCell(ws8, 3, summaryCol, "Distribution of Ending Wealth Multiple");
  const pctLabels = [["P5 (pessimistic)",0.05],["P10",0.10],["P25",0.25],["P50 (median)",0.50],["P75",0.75],["P90",0.90],["P95 (optimistic)",0.95]];
  let rr8 = 4;
  pctLabels.forEach(([lbl,p]) => {
    setCell(ws8, rr8, summaryCol, lbl);
    setCell(ws8, rr8, summaryCol+1, `=PERCENTILE(${endColLetter}${gridFirst+1}:${endColLetter}${gridLast+1},${p})`, {z:'0.00'});
    rr8++;
  });
  rr8++;
  setCell(ws8, rr8, summaryCol, "Mean Ending Wealth Multiple");
  setCell(ws8, rr8, summaryCol+1, `=AVERAGE(${endColLetter}${gridFirst+1}:${endColLetter}${gridLast+1})`, {z:'0.00'}); rr8++;
  setCell(ws8, rr8, summaryCol, "% of Trials Ending Above 1.0x (no loss)");
  setCell(ws8, rr8, summaryCol+1, `=COUNTIF(${endColLetter}${gridFirst+1}:${endColLetter}${gridLast+1},">1")/${N_TRIALS2}`, {z:PCT1});
  ws8['!cols'] = [{wch:9}].concat(Array(N_YEARS2).fill({wch:10}));
  XLSX.utils.book_append_sheet(wb, ws8, 'Monte Carlo Simulation');

  return { wb, funds, PORT_RET_FINAL, PORT_BETA_FINAL, PORT_SD_FINAL, PORT_RF_FINAL };
}

function buildWorkbook(c) {

  const wb = XLSX.utils.book_new();

  // Assumptions sheet
  const assumptionsAOA = [
    ['Assumptions & Inputs', ''],
    ['Client', c.name],
    ['Prepared by', (c.rm.name || app.firm.name || '') + (c.rm.designation ? ' (' + c.rm.designation + ')' : '')],
    ['Date', new Date().toLocaleDateString('en-IN')],
    [],
    ['Monthly income (₹)', Number(d.monthlyIncome)||0],
    ['Monthly expenses (₹)', Number(d.monthlyExpenses)||0],
    ['Monthly debt/EMI (₹)', Number(d.monthlyDebt)||0],
    ['Monthly surplus (₹, formula)', null],
    [],
    ['Equity return (long-run avg)', 0.12],
    ['Debt return (long-run avg)', 0.07],
    ['Gold return (long-run avg)', 0.08],
    ['Cash/Liquid return', 0.06],
    ['General inflation', 0.06],
  ];
  const wsA = XLSX.utils.aoa_to_sheet(assumptionsAOA);
  wsA['B9'] = { t: 'n', f: 'B6-B7-B8' };
  wsA['!cols'] = [{wch: 34},{wch: 16}];
  XLSX.utils.book_append_sheet(wb, wsA, 'Assumptions');

  // Goals & Projection sheet
  const goalsAOA = [
    ['Goal', 'Amount Today (₹)', 'Horizon (yrs)', 'Inflated Target (₹)', 'Bucket Return Assumption', 'Monthly SIP Needed (₹)', 'Notes'],
  ];
  const goals = d.goals.filter(g => g.name && g.amount && g.years);
  goals.forEach((g, i) => {
    const row = i + 2;
    const bucket = Number(g.years) <= 3 ? 'short' : Number(g.years) <= 8 ? 'medium' : 'long';
    const bucketReturn = bucket === 'short' ? 0.065 : bucket === 'medium' ? 0.09 : 0.105;
    goalsAOA.push([g.name, Number(g.amount), Number(g.years), null, bucketReturn, null, bucket + '-term bucket']);
  });
  const wsG = XLSX.utils.aoa_to_sheet(goalsAOA);
  goals.forEach((g, i) => {
    const row = i + 2;
    wsG['D' + row] = { t: 'n', f: 'B' + row + '*(1+Assumptions!$B$14)^C' + row };
    wsG['F' + row] = { t: 'n', f: '(D' + row + '/(((1+E' + row + '/12)^(C' + row + '*12)-1)/(E' + row + '/12)))' };
  });
  wsG['!cols'] = [{wch:26},{wch:16},{wch:12},{wch:18},{wch:14},{wch:18},{wch:16}];
  XLSX.utils.book_append_sheet(wb, wsG, 'Goals & Projection');

  // Summary sheet
  const summaryAOA = [['Item', 'Value']];
  summaryAOA.push(['Binding risk constraint', s.reconciliation.bindingLabel + ' (' + s.reconciliation.which + ')']);
  summaryAOA.push(['Capacity score', s.capacity.score + ' / 100 (' + s.capacity.label + ')']);
  summaryAOA.push(['Total goals', goals.length]);
  const wsS = XLSX.utils.aoa_to_sheet(summaryAOA);
  wsS['!cols'] = [{wch:26},{wch:40}];
  XLSX.utils.book_append_sheet(wb, wsS, 'Summary');

  return wb;
}

app.exportExcel = async function() {
  const c = app.clients[app.currentClientId];
  const { wb } = buildComprehensiveWorkbook(c);
  const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  const blob = new Blob([wbout], { type: 'application/octet-stream' });
  const filename = 'PortfolioAnalysis_' + c.name.replace(/[^a-z0-9]+/gi, '_') + '.xlsx';
  await saveBlob(blob, filename);
};

app.exportSimpleExcel = async function() {
  const c = app.clients[app.currentClientId];
  const wb = buildWorkbook(c);
  const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  const blob = new Blob([wbout], { type: 'application/octet-stream' });
  const filename = 'GoalProjection_' + c.name.replace(/[^a-z0-9]+/gi, '_') + '.xlsx';
  await saveBlob(blob, filename);
};

async function saveBlob(blob, filename) {
  if (!app.downloads) { toast('Download isn\'t available in this view.'); return; }
  try {
    const res = await app.downloads.save({ filename, data: blob });
    toast(res.status === 'saved' ? 'Saved ' + filename : 'Sent ' + filename);
  } catch (e) {
    if (e && e.code === 'declined') { toast('Download cancelled.'); return; }
    toast('Download was not completed.');
  }
}

(async function init() {
  document.getElementById('newClientNameInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') app.confirmNewClient();
    if (e.key === 'Escape') app.cancelNewClient();
  });
  try { app.db = await window.claude.use('db'); } catch (e) { app.db = null; }
  try { app.downloads = await window.claude.use('downloads'); } catch (e) { app.downloads = null; }
  await loadAll();
})();
