<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Client Dossier — IPS Workflow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html-docx-js@0.3.1/dist/html-docx.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --ink: #10202b;
    --ink-2: #1a2f3d;
    --paper: #faf7f0;
    --paper-2: #f1ece0;
    --brass: #a8763f;
    --brass-2: #c79256;
    --sage: #6f8a76;
    --rust: #a44f3e;
    --line: #d8cfbb;
    --text: #1c231f;
    --text-dim: #5a6259;
    --card: #ffffff;
    --shadow: 0 1px 2px rgba(16,32,43,0.06);
    --radius: 3px;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #eae3d3; --ink-2: #d9cfb8; --paper: #0d1614; --paper-2: #16211e;
      --brass: #d9a869; --brass-2: #e8bd85; --sage: #8fae95; --rust: #c97561;
      --line: #2c3733; --text: #eee9dc; --text-dim: #a7ab9f; --card: #131c19;
      --shadow: 0 1px 3px rgba(0,0,0,0.4);
    }
  }
  :root[data-theme="dark"] {
    --ink: #eae3d3; --ink-2: #d9cfb8; --paper: #0d1614; --paper-2: #16211e;
    --brass: #d9a869; --brass-2: #e8bd85; --sage: #8fae95; --rust: #c97561;
    --line: #2c3733; --text: #eee9dc; --text-dim: #a7ab9f; --card: #131c19;
    --shadow: 0 1px 3px rgba(0,0,0,0.4);
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--paper);
    color: var(--text);
    font-family: 'IBM Plex Sans', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  h1, h2, h3, .serif { font-family: 'Source Serif 4', Georgia, serif; }
  .mono { font-family: 'IBM Plex Mono', monospace; }

  #shell {
    display: flex;
    min-height: 100%;
    max-width: 1400px;
    margin: 0 auto;
  }

  /* ---------- Sidebar (the case-file spine) ---------- */
  #spine {
    width: 280px;
    flex-shrink: 0;
    background: var(--ink);
    color: var(--paper);
    padding: 28px 22px;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }
  @media (max-width: 860px) {
    #shell { flex-direction: column; }
    #spine { width: 100%; height: auto; position: relative; padding: 18px; }
  }
  .brandmark {
    display: flex; align-items: baseline; gap: 8px;
    margin-bottom: 6px;
  }
  .brandmark .seal {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--brass-2); flex-shrink: 0;
  }
  #firmname {
    font-size: 15px; font-weight: 600; color: var(--paper);
    letter-spacing: 0.01em;
  }
  .tagline { font-size: 11.5px; color: #b9c2b3; margin: 0 0 26px; line-height: 1.5; }

  .client-picker { margin-bottom: 22px; }
  .client-picker label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.09em; color: #8fa090; display: block; margin-bottom: 6px; }
  select#clientSelect {
    width: 100%; padding: 9px 10px; background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.16); color: var(--paper); border-radius: var(--radius);
    font-size: 13.5px; font-family: inherit;
  }
  .newclient-btn {
    width: 100%; margin-top: 8px; padding: 9px 10px;
    background: transparent; border: 1px dashed rgba(255,255,255,0.3);
    color: #cfd8c9; border-radius: var(--radius); cursor: pointer; font-size: 13px;
    font-family: inherit;
  }
  .newclient-btn:hover { border-color: var(--brass-2); color: var(--brass-2); }

  .stagelist { list-style: none; padding: 0; margin: 0; flex: 1; }
  .stagelist li {
    display: flex; gap: 12px; padding: 13px 6px; cursor: pointer;
    border-left: 2px solid transparent; margin-left: -6px; padding-left: 12px;
    border-radius: 0 var(--radius) var(--radius) 0;
  }
  .stagelist li:hover { background: rgba(255,255,255,0.04); }
  .stagelist li.active { border-left-color: var(--brass-2); background: rgba(255,255,255,0.05); }
  .stagelist .num {
    font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #7d8c77;
    width: 18px; flex-shrink: 0; padding-top: 1px;
  }
  .stagelist li.active .num, .stagelist li.done .num { color: var(--brass-2); }
  .stagelist .label { font-size: 13.5px; line-height: 1.35; }
  .stagelist .sub { font-size: 11px; color: #8b968a; margin-top: 2px; }
  .stagelist li.locked { opacity: 0.4; cursor: not-allowed; }

  .spine-foot { font-size: 10.5px; color: #6d7a68; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.1); }

  /* ---------- Main content ---------- */
  #main { flex: 1; min-width: 0; padding: 36px 44px 80px; }
  @media (max-width: 860px) { #main { padding: 22px 18px 60px; } }
  @media (max-width: 640px) { #main { padding: 16px 14px 50px; } }

  .stage-head { margin-bottom: 28px; }
  .stage-eyebrow { font-size: 12px; color: var(--brass); font-weight: 600; margin: 0 0 6px; }
  .stage-title { font-size: 26px; margin: 0 0 8px; font-weight: 600; color: var(--ink); }
  .stage-desc { font-size: 14.5px; color: var(--text-dim); max-width: 640px; line-height: 1.6; margin: 0; }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 22px 24px; margin-bottom: 18px; box-shadow: var(--shadow);
  }
  .card h3 { font-size: 15px; margin: 0 0 4px; color: var(--ink); font-weight: 600; }
  .card .hint { font-size: 12.5px; color: var(--text-dim); margin: 0 0 16px; }

  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 12.5px; font-weight: 500; color: var(--text); margin-bottom: 5px; }
  .field .fhint { font-size: 11px; color: var(--text-dim); margin-top: 4px; }
  input[type=text], input[type=number], textarea, select {
    width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: var(--radius);
    font-size: 13.5px; font-family: inherit; background: var(--paper); color: var(--text);
  }
  textarea { resize: vertical; min-height: 60px; }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--brass-2); outline-offset: 1px; border-color: var(--brass); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
  @media (max-width: 640px) { .row2, .row3 { grid-template-columns: 1fr; } }
  .checkrow { display: flex; align-items: center; gap: 8px; }
  .checkrow input { width: auto; }
  .checkrow label { margin: 0; font-size: 13px; }

  button.primary {
    background: var(--ink); color: var(--paper); border: none; padding: 11px 22px;
    border-radius: var(--radius); font-size: 13.5px; font-weight: 500; cursor: pointer; font-family: inherit;
  }
  button.primary:hover { background: var(--ink-2); }
  button.secondary {
    background: transparent; color: var(--ink); border: 1px solid var(--line); padding: 10px 20px;
    border-radius: var(--radius); font-size: 13.5px; cursor: pointer; font-family: inherit;
  }
  button.secondary:hover { border-color: var(--brass); color: var(--brass); }
  button.ghost {
    background: transparent; border: none; color: var(--text-dim); cursor: pointer;
    font-size: 12.5px; padding: 4px 6px; text-decoration: underline; font-family: inherit;
  }
  .actions { display: flex; gap: 10px; margin-top: 22px; align-items: center; }
  .savenote { font-size: 12px; color: var(--sage); margin-left: 4px; }

  .goal-row {
    display: grid; grid-template-columns: 2fr 1fr 0.8fr 1fr auto; gap: 10px; align-items: end;
    padding: 12px 0; border-bottom: 1px solid var(--line);
  }
  @media (max-width: 760px) { .goal-row { grid-template-columns: 1fr 1fr; } }
  .goal-row:last-child { border-bottom: none; }
  .remove-goal { background: none; border: none; color: var(--rust); cursor: pointer; font-size: 18px; line-height: 1; padding: 6px; }

  table.ledger { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.ledger th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); padding: 8px 10px; border-bottom: 1.5px solid var(--ink); font-weight: 600; }
  table.ledger td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.ledger tr:last-child td { border-bottom: none; }
  table.ledger td textarea, table.ledger td input { font-size: 12.5px; padding: 6px 8px; }

  .badge { display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 500; }
  .badge.low { background: #f3e3d8; color: var(--rust); }
  .badge.moderate { background: #f1ecd8; color: #8a7326; }
  .badge.high { background: #e2ecdf; color: var(--sage); }
  :root[data-theme="dark"] .badge.low, @media (prefers-color-scheme: dark) { }
  .bucket-block { margin-bottom: 22px; }
  .bucket-block h4 { font-size: 14px; margin: 0 0 10px; color: var(--ink); display: flex; align-items: center; gap: 8px; }
  .bucket-block h4 .tag { font-size: 10.5px; font-weight: 500; color: var(--text-dim); background: var(--paper-2); padding: 2px 8px; border-radius: 20px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-dim); }
  .empty-state h3 { color: var(--ink); font-size: 18px; margin-bottom: 8px; }

  .split-panel { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 900px) { .split-panel { grid-template-columns: 1fr; } }

  .quote-pull {
    border-left: 3px solid var(--brass); padding: 10px 14px; margin: 10px 0;
    background: var(--paper-2); font-size: 13px; font-style: italic; color: var(--text);
    border-radius: 0 var(--radius) var(--radius) 0;
  }
  .quote-pull .attrib { display: block; font-style: normal; font-size: 11px; color: var(--text-dim); margin-top: 4px; }

  .chart-wrap { max-width: 320px; margin: 0 auto; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 6px; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: var(--paper); padding: 10px 20px; border-radius: var(--radius);
    font-size: 13px; opacity: 0; pointer-events: none; transition: all 0.25s ease;
    z-index: 100; bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(16,32,43,0.55); z-index: 200;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-overlay.hidden { display: none; }
  .modal-box {
    background: var(--card); border-radius: var(--radius); padding: 26px 28px;
    max-width: 400px; width: 100%; box-shadow: 0 8px 30px rgba(0,0,0,0.25);
  }
  .modal-box h3 { margin: 0 0 6px; font-size: 17px; color: var(--ink); }
  .modal-box p { margin: 0 0 16px; font-size: 13px; color: var(--text-dim); }
  .modal-box .actions { margin-top: 18px; }
</style>
</head>
<body>
<div id="shell">
  <nav id="spine">
    <div class="brandmark"><span class="seal"></span><span id="firmname">Loading…</span></div>
    <p class="tagline" id="firmtag"></p>

    <div class="client-picker">
      <label for="clientSelect">Client file</label>
      <select id="clientSelect"></select>
      <button class="newclient-btn" onclick="app.newClient()">+ New client</button>
    </div>

    <ul class="stagelist" id="stagelist"></ul>

    <button class="newclient-btn" style="margin-bottom:14px" onclick="app.openSettings()">⚙ Settings</button>
    <div class="spine-foot">The Client Dossier — an IPS workflow tool</div>
  </nav>

  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>

<div class="modal-overlay hidden" id="newClientModal">
  <div class="modal-box">
    <h3>New client file</h3>
    <p>Give this client (or persona) a name. You can rename it later from Client Discovery.</p>
    <div class="field">
      <input type="text" id="newClientNameInput" placeholder="e.g. R. Menon" autocomplete="off">
    </div>
    <div class="actions">
      <button class="primary" onclick="app.confirmNewClient()">Create client</button>
      <button class="secondary" onclick="app.cancelNewClient()">Cancel</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   STATE
============================================================ */
const app = {
  db: null,
  downloads: null,
  firm: { name: "", philosophy: "", trackRecord: "" },
  rmProfile: { name: "", designation: "", email: "", phone: "", intro: "" },
  clients: {},       // id -> client object
  currentClientId: null,
  currentStage: 1,
};

function blankClient(name) {
  const id = 'c_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  return {
    id, name: name || "New client", createdAt: Date.now(), stage: 1,
    rm: Object.assign({ name: "", designation: "", email: "", phone: "", intro: "" }, app.rmProfile || {}),
    discovery: {
      age: "", occupation: "", monthlyIncome: "", monthlyExpenses: "", monthlyDebt: "",
      dependents: "", dependentNotes: "",
      assets: "", liabilities: "",
      liquidityBuffer: "unknown", nearTermCashNeed: false, nearTermNotes: "",
      incomeStability: "stable",
      insuranceGap: false, insuranceNotes: "",
      taxRegime: "unsure",
      statedRisk: "moderate", riskNotes: "",
      returnExpectation: "",
      constraints: "", familyNotes: "", otherNotes: "",
      goals: [ { name: "", amount: "", years: "" } ],
    },
    solution: null,   // filled by Stage 3 engine, then editable
    finalized: false,
  };
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._h);
  toast._h = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ============================================================
   PERSISTENCE
============================================================ */
let saveTimer = null;
function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    persistCurrentClient();
    persistFirm();
    persistRMDefault();
  }, 500);
}

async function persistFirm() {
  if (!app.db) return;
  try { await app.db.doc('firm/profile').set(app.firm); } catch (e) { /* offline-safe */ }
}

async function persistRMDefault() {
  if (!app.db) return;
  try { await app.db.doc('firm/rmDefault').set(app.rmProfile); } catch (e) { /* offline-safe */ }
}

async function persistCurrentClient() {
  if (!app.db || !app.currentClientId) return;
  const c = app.clients[app.currentClientId];
  if (!c) return;
  try { await app.db.doc('clients/' + c.id).set(c); } catch (e) { /* offline-safe */ }
}

// Scrub any stale SGB references from saved solutions — runs on every client load
function purgeSGBFromSolution(c) {
  if (!c.solution) return;
  const SGB_PATTERNS = [/sovereign gold bond/i, /\bsgb\b/i, /gold bond/i];
  Object.values(c.solution.buckets || {}).forEach(bucket => {
    (bucket.instruments || []).forEach(ins => {
      const hasSGB = SGB_PATTERNS.some(rx => rx.test(ins.cat) || rx.test(ins.why));
      if (hasSGB) {
        ins.cat = 'Gold ETF (e.g. Nippon India Gold ETF, SBI ETF Gold) for demat holders; Gold Fund of Fund (e.g. SBI Gold Fund) for those without a demat account';
        ins.why = 'Zero storage and making charges, direct price linkage to LBMA gold, fully liquid and tradeable on exchange. Gold ETF is the preferred route for clients with a demat account; Gold Fund of Fund achieves the same exposure without one, at a marginally higher expense ratio.';
      }
    });
  });
}

async function loadAll() {
  if (!app.db) { render(); return; }
  try {
    const firmSnap = await app.db.doc('firm/profile').get();
    if (firmSnap && firmSnap.exists) app.firm = Object.assign(app.firm, firmSnap.data());
  } catch (e) {}
  try {
    const rmSnap = await app.db.doc('firm/rmDefault').get();
    if (rmSnap && rmSnap.exists) app.rmProfile = Object.assign(app.rmProfile, rmSnap.data());
  } catch (e) {}
  try {
    const qsnap = await app.db.collection('clients').get();
    const docs = (qsnap && qsnap.docs) || [];
    for (const snap of docs) {
      if (!snap.exists) continue;
      const data = snap.data();
      if (data && data.id) {
        purgeSGBFromSolution(data);
        app.clients[data.id] = data;
      }
    }
  } catch (e) {}
  const ids = Object.keys(app.clients);
  if (ids.length && !app.currentClientId) {
    app.currentClientId = ids.sort((a,b) => (app.clients[b].createdAt||0)-(app.clients[a].createdAt||0))[0];
    app.currentStage = app.clients[app.currentClientId].stage || 1;
  }
  render();
}

/* ============================================================
   CLIENT / NAV ACTIONS
============================================================ */
app.newClient = function() {
  const modal = document.getElementById('newClientModal');
  const input = document.getElementById('newClientNameInput');
  input.value = '';
  modal.classList.remove('hidden');
  setTimeout(() => input.focus(), 30);
};

app.cancelNewClient = function() {
  document.getElementById('newClientModal').classList.add('hidden');
};

app.confirmNewClient = function() {
  const input = document.getElementById('newClientNameInput');
  const name = (input.value || '').trim() || 'New client';
  const c = blankClient(name);
  app.clients[c.id] = c;
  app.currentClientId = c.id;
  app.currentStage = 1;
  persistCurrentClient();
  document.getElementById('newClientModal').classList.add('hidden');
  render();
};

app.selectClient = function(id) {
  app.currentClientId = id;
  if (app.clients[id]) purgeSGBFromSolution(app.clients[id]);
  app.currentStage = (app.clients[id] && app.clients[id].stage) || 1;
  render();
};

app.goToStage = function(n) {
  const c = app.clients[app.currentClientId];
  if (!c) { toast("Create or select a client first."); return; }
  if (n > 2 && !c.solution) { toast("Complete Client Discovery first."); return; }
  app.currentStage = n;
  render();
};

app.openSettings = function() {
  app.currentStage = 'settings';
  render();
};

app.updateFirm = function(field, value) {
  app.firm[field] = value;
  scheduleSave();
};

app.updateRMDefault = function(field, value) {
  app.rmProfile[field] = value;
  scheduleSave();
};

app.setClientRM = function(field, value) {
  const c = app.clients[app.currentClientId];
  if (!c) return;
  c.rm[field] = value;
  scheduleSave();
};

app.useDefaultRM = function() {
  const c = app.clients[app.currentClientId];
  if (!c) return;
  c.rm = Object.assign({}, c.rm, app.rmProfile);
  scheduleSave();
  render();
};

app.setDiscovery = function(field, value) {
  const c = app.clients[app.currentClientId];
  if (!c) return;
  c.discovery[field] = value;
  scheduleSave();
};

app.addGoal = function() {
  const c = app.clients[app.currentClientId];
  c.discovery.goals.push({ name: "", amount: "", years: "" });
  scheduleSave();
  render();
};
app.removeGoal = function(i) {
  const c = app.clients[app.currentClientId];
  c.discovery.goals.splice(i, 1);
  if (!c.discovery.goals.length) c.discovery.goals.push({ name: "", amount: "", years: "" });
  scheduleSave();
  render();
};
app.setGoalField = function(i, key, value) {
  const c = app.clients[app.currentClientId];
  c.discovery.goals[i][key] = value;
  scheduleSave();
};

app.completeDiscovery = function() {
  const c = app.clients[app.currentClientId];
  const goals = c.discovery.goals.filter(g => g.name && g.amount && g.years);
  if (!goals.length) { toast("Add at least one goal with a name, amount and horizon."); return; }
  c.solution = generateSolution(c);
  c.stage = 3;
  persistCurrentClient();
  app.currentStage = 3;
  toast("Draft solution generated from discovery notes.");
  render();
};

app.regenerateDraft = function() {
  const c = app.clients[app.currentClientId];
  const preserved = c.solution ? { advisorOverrideNote: c.solution.advisorOverrideNote } : {};
  c.solution = Object.assign(generateSolution(c), preserved);
  persistCurrentClient();
  toast("Draft regenerated from current discovery notes. Manual edits below were reset.");
  render();
};

app.finalizeSolution = function() {
  const c = app.clients[app.currentClientId];
  c.stage = 4;
  c.finalized = true;
  persistCurrentClient();
  app.currentStage = 4;
  render();
};

/* ============================================================
   RULES ENGINE — Stage 3 "Backstage" logic
   Transparent, editable heuristics — not a black box. Every number
   the engine proposes is meant to be reviewed and can be overridden
   by the advisor before Stage 4.
============================================================ */
const ORD = { Low: 0, Moderate: 1, High: 2 };

function bucketGoals(goals) {
  const out = { short: [], medium: [], long: [] };
  goals.forEach(g => {
    const y = Number(g.years) || 0;
    if (y <= 3) out.short.push(g);
    else if (y <= 8) out.medium.push(g);
    else out.long.push(g);
  });
  return out;
}

function computeCapacity(d) {
  let score = 50;
  const factors = [];

  // FIX #1: Validate income floor
  const income = Number(d.monthlyIncome) || 0;
  if (income === 0) { score -= 20; factors.push('No verifiable income provided — capacity severely limited until confirmed.'); }

  if (d.liquidityBuffer === 'adequate') { score += 15; factors.push('Adequate emergency liquidity buffer supports higher capacity.'); }
  else if (d.liquidityBuffer === 'inadequate') { score -= 15; factors.push('Inadequate liquidity buffer reduces capacity to absorb loss.'); }
  else { factors.push('Liquidity buffer status not established — treated as neutral pending confirmation.'); }

  if (d.incomeStability === 'stable') { score += 10; factors.push('Stable, salaried income supports higher capacity.'); }
  else if (d.incomeStability === 'irregular') { score -= 10; factors.push('Irregular or lumpy income reduces capacity.'); }

  const dep = Number(d.dependents) || 0;
  if (dep > 2) { const pen = Math.min((dep - 2) * 5, 20); score -= pen; factors.push(dep + ' dependents beyond the first two reduce capacity.'); } // FIX #2: Cap at 20pp

  const debt = Number(d.monthlyDebt) || 0;
  if (income > 0) {
    const ratio = debt / income;
    if (ratio > 0.4) { score -= 15; factors.push('Debt servicing exceeds 40% of income — materially reduces capacity.'); }
    else if (ratio > 0.2) { score -= 5; factors.push('Debt servicing is 20–40% of income — modestly reduces capacity.'); }
  }
  if (d.insuranceGap) { score -= 10; factors.push('An insurance gap was flagged — reduces capacity until closed.'); }
  if (d.nearTermCashNeed) { score -= 10; factors.push('An unplanned near-term cash need was flagged — reduces capacity.'); }

  score = Math.max(0, Math.min(100, score));
  const label = score < 35 ? 'Low' : score < 65 ? 'Moderate' : 'High';
  return { score, label, factors };
}

function reconcileRisk(statedRisk, capacity) {
  const statedLabel = statedRisk.charAt(0).toUpperCase() + statedRisk.slice(1);
  const bindingOrd = Math.min(ORD[statedLabel] ?? 1, ORD[capacity.label]);
  const bindingLabel = Object.keys(ORD).find(k => ORD[k] === bindingOrd);
  let which, explanation;
  if (ORD[capacity.label] < ORD[statedLabel]) {
    which = 'capacity';
    explanation = `The client's stated risk tolerance (${statedLabel}) is higher than what the financial position can currently absorb (${capacity.label} capacity). Capacity is the binding constraint: the plan is built to the more conservative of the two, since a client cannot safely take more risk than their circumstances allow, regardless of comfort with volatility.`;
  } else if (ORD[statedLabel] < ORD[capacity.label]) {
    which = 'tolerance';
    explanation = `The client's stated risk tolerance (${statedLabel}) is more conservative than their financial capacity would allow (${capacity.label} capacity). Tolerance is respected as the binding constraint here: there is no reason to push a client into more volatility than they are comfortable with simply because their finances could technically absorb it.`;
  } else {
    which = 'aligned';
    explanation = `Stated risk tolerance and financial capacity are both ${statedLabel} — they are aligned, so no reconciliation is required.`;
  }
  return { bindingLabel, which, explanation };
}

/* ============================================================
   DRAWDOWN & CALMAR ADDITIONS
   Max drawdown per category: worst historical (Covid crash, as the
   most recent severe test). Used to compute Calmar ratio and to
   constrain the within-sleeve optimizer.
============================================================ */
const MAX_DD_BY_CAT = {
  N50: -0.38, N500: -0.55, MA: -0.24, GOLD: 0.07,
  SPX: -0.20, THM: -0.40, DEBT: -0.02, CASH: 0.00, AIF: -0.18,
};

function fundMaxDrawdown(f) {
  // CAPM-based: Beta × category worst drawdown (bounded at 0 — gold doesn't drawdown in crashes)
  const catDD = MAX_DD_BY_CAT[f.bmcat] || 0;
  return Math.min(0, catDD * f.beta);
}

function portfolioMaxDrawdown(funds) {
  return funds.reduce((sum, f) => sum + f.weight * fundMaxDrawdown(f), 0);
}

function calmarRatio(ret, maxDD) {
  const absDD = Math.abs(maxDD);
  return absDD > 0.001 ? (ret - RISK_FREE) / (absDD * 100) : 0;
}

function portfolioStatsJS(funds) {
  let ret = 0, beta = 0;
  funds.forEach(f => { ret += f.weight * f.ret; beta += f.weight * f.beta; });
  let variance = 0;
  funds.forEach(fi => funds.forEach(fj => {
    variance += fi.weight * fj.weight * fi.sd * fj.sd * getCorr2(fi.bmcat, fj.bmcat);
  }));
  const sd = Math.sqrt(variance);
  const sharpe = sd > 0 ? (ret - RISK_FREE) / sd : 0;
  const treynor = beta > 0 ? (ret - RISK_FREE) / beta : 0;
  const maxDD = portfolioMaxDrawdown(funds);
  const calmar = calmarRatio(ret, maxDD);
  return { ret, beta, sd, sharpe, treynor, maxDD, calmar };
}

/* ============================================================
   WITHIN-SLEEVE OPTIMIZER
   Optimises fund weights within a single named-fund array
   (e.g. the equity sleeve of a bucket) to maximise Sharpe
   and, separately, Calmar. Returns equal-weight, best-Sharpe
   and best-Calmar weight vectors.
============================================================ */
function optimizeSleeve(funds, nTrials) {
  nTrials = nTrials || 8000;
  const n = funds.length;
  if (n <= 1) {
    const w = funds.map(() => 1/n);
    const stats = portfolioStatsJS(funds.map((f,i) => Object.assign({},f,{weight:w[i]})));
    return { equalWeight: w, sharpeWeight: w, calmarWeight: w,
             equalStats: stats, sharpeStats: stats, calmarStats: stats };
  }
  const CAP = 0.35;
  const MIN = 0.05;
  let bestSharpe = { score: -Infinity, w: null, stats: null };
  let bestCalmar = { score: -Infinity, w: null, stats: null };
  const equalW = funds.map(() => 1/n);
  const equalFunds = funds.map((f,i) => Object.assign({},f,{weight:equalW[i]}));
  const equalStats = portfolioStatsJS(equalFunds);

  for (let t = 0; t < nTrials; t++) {
    let raw = funds.map(() => Math.random());
    let sum = raw.reduce((a,b) => a+b, 0);
    let w = raw.map(r => r/sum);
    // apply cap and min floor iteratively
    for (let iter = 0; iter < 5; iter++) {
      w = w.map(x => Math.min(CAP, Math.max(MIN, x)));
      const s = w.reduce((a,b) => a+b, 0);
      w = w.map(x => x/s);
    }
    const wFunds = funds.map((f,i) => Object.assign({},f,{weight:w[i]}));
    const stats = portfolioStatsJS(wFunds);
    if (stats.sharpe > bestSharpe.score) bestSharpe = { score: stats.sharpe, w: w.slice(), stats };
    if (stats.calmar > bestCalmar.score) bestCalmar = { score: stats.calmar, w: w.slice(), stats };
  }
  return {
    equalWeight: equalW, sharpeWeight: bestSharpe.w, calmarWeight: bestCalmar.w,
    equalStats, sharpeStats: bestSharpe.stats, calmarStats: bestCalmar.stats,
  };
}

/* ============================================================
   PRIORITY-AWARE BUCKET ALLOCATION
   Derives equity/debt/gold/cash/alt percentages from:
     1. Bucket time-horizon band (short / medium / long)
     2. Binding risk capacity label (Low / Moderate / High)
     3. Goal priorities within the bucket
     4. Shortest remaining horizon within the bucket
          (a medium bucket with a 4-year goal is treated more
           conservatively than one whose shortest goal is 8 years)
   Returns an allocation array with explicit rationale per row
   that the advisor can defend line-by-line.
============================================================ */
const HORIZON_EQUITY_CEILING = {
  short:  { Low: 5,  Moderate: 10, High: 15 },
  medium: { Low: 30, Moderate: 45, High: 60 },
  long:   { Low: 50, Moderate: 65, High: 80 },
};

function priorityAwareAllocation(bKey, goals, bindingLabel) {
  // Sort goals by horizon (soonest first) — most conservative goal drives the floor
  const sorted = goals.slice().sort((a,b) => (Number(a.years)||99) - (Number(b.years)||99));
  const shortestYears = Number(sorted[0]?.years) || 1;
  const highestPriority = sorted[0]?.priority || '';
  const isPriority1 = /^#?1\b|^first\b|^critical\b|^urgent\b/i.test(String(highestPriority)); // FIX #6: Word boundaries prevent false positives

  // Determine effective band from the SHORTEST goal's horizon, not bucket label
  // (a bucket labelled "medium" whose soonest goal matures in 3.5 years should be
  //  treated more like a short bucket for that goal's protection)
  let effectiveBand = bKey;
  if (bKey === 'long' && shortestYears <= 8) effectiveBand = 'medium';
  if (bKey === 'medium' && shortestYears <= 3) effectiveBand = 'short';

  let eqCeiling = HORIZON_EQUITY_CEILING[effectiveBand][bindingLabel];

  // Priority tightening: Priority-1 goal with soonest horizon → pull equity down 10pp
  // (capital you cannot afford to lose before the goal date)
  if (isPriority1 && effectiveBand !== 'long') eqCeiling = Math.max(0, eqCeiling - 10);

  // Multiple competing goals → pull down 5pp further (more lives riding on this bucket)
  if (goals.length > 1 && effectiveBand !== 'long') eqCeiling = Math.max(0, eqCeiling - 5);

  const eqMid = Math.round(eqCeiling * 0.85);  // target midpoint, range = ±5
  const eqLo = Math.max(0, eqMid - 5);
  const eqHi = eqMid + 5;

  // Rationale is specific to what drove the equity ceiling
  let eqRationale = `${bindingLabel} risk capacity with a ${effectiveBand}-term horizon sets an equity ceiling of ${eqCeiling}%.`;
  if (effectiveBand !== bKey) eqRationale += ` The bucket is labelled ${bKey}-term but its soonest goal matures in ${shortestYears} years, so the allocation uses the ${effectiveBand}-term ceiling to protect that goal.`;
  if (isPriority1 && effectiveBand !== 'long') eqRationale += ` Reduced a further 10pp because this bucket contains a Priority-1 goal — capital that cannot be exposed to a drawdown the client cannot afford to absorb.`;
  if (goals.length > 1 && effectiveBand !== 'long') eqRationale += ` A further 5pp reduction for ${goals.length} competing goals sharing this bucket — conservative allocation protects the soonest-maturing goal from being undershooted.`;

  // Build remaining allocation: Gold (medium+), Alternatives (long only), Cash (short+medium), Debt = remainder
  const gold = effectiveBand === 'short' ? 0 : 5;
  const alts = effectiveBand === 'long' && bindingLabel !== 'Low' ? 5 : 0;
  const cash = effectiveBand === 'short' ? 20 : effectiveBand === 'medium' ? 5 : 0;
  const debt = Math.max(0, 100 - eqMid - gold - alts - cash);

  const rebalanceTrigger = isPriority1
    ? '±3% drift threshold (tighter, because a Priority-1 goal cannot afford timing slippage)'
    : '±5% drift threshold (standard)';
  // FIX #8: Cap glide path step to prevent negatives
  const glideStepPerYear = Math.min(Math.round(eqMid / shortestYears), Math.round(eqMid / 2));
  const glide = shortestYears <= 5
    ? `With the soonest goal ${shortestYears} years away, begin the glide path immediately: step equity down by ${glideStepPerYear}pp per year toward near-zero equity in the final 12 months.`
    : `Begin stepping equity down toward the short-term allocation 2 years before the soonest goal date (in approximately ${shortestYears - 2} years).`;

  const rows = [
    { asset: 'Equity', range: `${eqLo}–${eqHi}%`, rationale: eqRationale },
    { asset: 'Debt', range: `${debt - 5}–${debt + 5}%`, rationale: `Remainder after equity, gold and cash — anchors capital stability. Will rise further along the glide path as goals approach.` },
  ];
  if (gold > 0) rows.push({ asset: 'Gold', range: `${gold}%`, rationale: 'Modest inflation and diversification hedge; kept small relative to growth assets.' });
  if (cash > 0) rows.push({ asset: 'Cash / Liquid', range: `${cash}–${cash + 5}%`, rationale: 'Same-week-access buffer for near-term withdrawal or an unplanned cash need.' });
  if (alts > 0) rows.push({ asset: 'Alternatives', range: `${alts}%`, rationale: 'Optional — only once all core goal contributions are fully funded.' });

  return { rows, rebalanceTrigger, glide };
}

/* ============================================================
   REBALANCING POLICY — priority-aware, per-bucket
============================================================ */
function generateRebalancing(buckets) {
  // buckets can be either the bucketGoals() output ({short:[],medium:[],long:[]})
  // or the solution.buckets object ({bKey:{goals:[],allocation:[],...}})
  // normalise to a flat goal list either way
  let goalList = [];
  if (Array.isArray(buckets.short)) {
    goalList = [...(buckets.short||[]), ...(buckets.medium||[]), ...(buckets.long||[])];
  } else {
    Object.values(buckets).forEach(b => { if (b && b.goals) goalList.push(...b.goals); });
  }
  const hasP1 = goalList.some(g => /^1|#1|first|top|critical|urgent/i.test(String(g.priority||'')));
  const nearTerm = goalList.some(g => Number(g.years) <= 5);
  const trigger = hasP1
    ? "Priority-1 goals: ±3% drift threshold. All other buckets: ±5% drift threshold. Annual calendar review in every case — whichever trigger fires first applies. Within 2 years of any goal date: monthly drift check for that bucket."
    : "Annual calendar review, combined with a ±5% drift threshold on any bucket's equity–debt split — whichever comes first.";
  return {
    trigger,
    fit: hasP1
      ? 'Tighter monitoring on Priority-1 buckets reflects the asymmetry: a shortfall in a must-fund goal cannot be recovered the way a long-term goal can. The cost of catching a drift breach early is one rebalance trade; the cost of missing it is a shortfall the client cannot absorb.'
      : 'This cadence is infrequent enough to be realistic for a busy client while ensuring a sharp market move does not silently breach the allocation the advisor has set.',
    glide: nearTerm
      ? 'For any goal within 5 years of its deadline, the glide path is already active — see each bucket\'s individual rebalancing trigger above. Within 2 years of any goal date, switch to a monthly drift check for that bucket: the exposure to a bad month is too large to let a quarterly review catch.'
      : 'No goal is currently within a glide-path window; revisit as goals approach their final 2–3 years.',
  };
}

function allocationFor(bucketName, bindingLabel, goals) {
  // Prefer the new priority-aware version when goals are available
  if (goals && goals.length) {
    return priorityAwareAllocation(bucketName, goals, bindingLabel).rows;
  }
  // Fallback (no goals passed — shouldn't happen in normal flow)
  if (bucketName === 'short') {
    const opts = { Low: [0,5], Moderate: [5,10], High: [10,15] }[bindingLabel];
    return [
      { asset: 'Equity', range: opts[0] + '–' + opts[1] + '%', rationale: 'Minimal even at higher capacity — money needed within 3 years should not be exposed to drawdown risk.' },
      { asset: 'Debt', range: (95-opts[1]) + '–' + (95-opts[0]) + '%', rationale: 'Anchors the bucket in capital stability for a near-term, non-negotiable need.' },
      { asset: 'Cash / Liquid', range: '20–25%', rationale: 'Ensures same-week access for the nearest goals in this bucket.' },
    ];
  }
  if (bucketName === 'medium') {
    const t = { Low: [20,30,60,70], Moderate: [35,45,45,55], High: [50,60,35,40] }[bindingLabel];
    return [
      { asset: 'Equity', range: t[0] + '–' + t[1] + '%', rationale: 'Some growth is appropriate over a 3–8 year window, scaled to ' + bindingLabel.toLowerCase() + ' risk capacity.' },
      { asset: 'Debt', range: t[2] + '–' + t[3] + '%', rationale: 'Provides the ballast this horizon needs; increases further as each goal approaches.' },
      { asset: 'Gold', range: '5%', rationale: 'Modest inflation hedge appropriate for a medium-dated rupee goal.' },
      { asset: 'Cash / Liquid', range: '5%', rationale: 'Buffer for the final 6–12 months before each goal date.' },
    ];
  }
  const t = { Low: [40,50,40,45], Moderate: [55,65,25,35], High: [70,80,15,20] }[bindingLabel];
  return [
    { asset: 'Equity', range: t[0] + '–' + t[1] + '%', rationale: 'Longest horizon in the plan; capacity to recover from interim drawdowns is genuinely available here.' },
    { asset: 'Debt', range: t[2] + '–' + t[3] + '%', rationale: 'Stability component, scaled to ' + bindingLabel.toLowerCase() + ' capacity.' },
    { asset: 'Gold', range: bindingLabel === 'Low' ? '10%' : '5–10%', rationale: 'Diversification and inflation hedge over a long horizon.' },
    { asset: 'Alternatives', range: '0–5%', rationale: "Optional, only once core buckets are funded — not essential to the plan's success." },
  ];
}

function instrumentsFor(bucketName, d) {
  const lowLit = /low literacy|simple|time-?poor|first[- ]time/i.test(d.constraints || '');
  const noDirectEq = /no direct equity|not direct equity|avoid direct equity/i.test(d.constraints || '');
  const base = {
    short: [
      { asset: 'Cash / Liquid', cat: 'Liquid mutual funds / sweep-in bank FDs', why: 'Same-day to T+1 liquidity with negligible capital risk for money needed within 3 years.' },
    ],
    medium: [
      { asset: 'Equity', cat: lowLit ? 'Index/passive hybrid or balanced fund' : 'Diversified index fund + short-duration debt fund', why: 'Low-cost, low-monitoring exposure appropriate for a 3–8 year goal.' },
      { asset: 'Debt', cat: 'PPF (if tax efficiency matters and lock-in fits the horizon)', why: 'Tax-free, disciplined, government-backed — a good fit for a medium-dated goal if the horizon allows.' },
    ],
    long: [
      { asset: 'Equity', cat: noDirectEq || lowLit ? 'Diversified equity index fund (no direct stock-picking)' : 'Diversified equity index fund or direct equity (if literacy/time allow)', why: 'Lowest-cost way to capture long-horizon equity growth.' },
      { asset: 'Debt', cat: 'EPF / NPS', why: 'Tax-advantaged, low-effort retirement-linked vehicles; NPS adds an extra Section 80CCD(1B) deduction where applicable.' },
      { asset: 'Gold', cat: 'Gold ETF (e.g. Nippon India Gold ETF, SBI ETF Gold) for demat holders; Gold Fund of Fund (e.g. SBI Gold Fund) for those without a demat account', why: 'Zero storage and making charges, direct price linkage to LBMA gold, fully liquid and tradeable on exchange. Gold ETF is the preferred route for clients with a demat account; Gold Fund of Fund achieves the same exposure without one, at a marginally higher expense ratio. SBI Gold Fund is already in this portfolio\'s gold sleeve, so no additional instrument is needed.' },
    ],
  };
  return base[bucketName];
}

function generateConstraints(d) {
  const out = [];
  out.push({ label: 'Tax', text: d.taxRegime === 'unsure'
      ? 'Tax regime (old vs. new) not yet confirmed — should be established with an actual computation before finalising instrument choices, since it changes whether PPF/ELSS-style 80C instruments are worth prioritising.'
      : 'Client indicated the ' + d.taxRegime + ' tax regime — instrument selection above assumes this; reconfirm before implementation.' });
  out.push({ label: 'Liquidity', text: d.liquidityBuffer === 'inadequate'
      ? 'Liquidity buffer is currently inadequate — building an emergency fund (ideally 6–9 months of expenses) should be treated as a precondition before other goals receive fresh contributions.'
      : d.liquidityBuffer === 'adequate'
      ? 'Liquidity buffer was reported as adequate; no immediate action required, but revisit annually.'
      : 'Liquidity buffer status was not established during discovery — confirm before finalising the plan.' });
  if (d.insuranceGap) out.push({ label: 'Insurance', text: (d.insuranceNotes || 'An insurance gap (life and/or health cover) was flagged.') + ' Closing this should be treated as a precondition alongside — not after — the investment plan.' });
  if (d.nearTermCashNeed) out.push({ label: 'Near-term cash need', text: d.nearTermNotes || 'An unplanned near-term cash need was flagged during discovery and should be sized and funded explicitly.' });
  out.push({ label: 'Legal / other', text: 'Nomination, will and estate documentation status was not confirmed during discovery — recommend addressing this alongside the investment plan, particularly if there are dependents.' });
  if (d.constraints) out.push({ label: 'Client-stated preferences', text: d.constraints });
  if (d.familyNotes) out.push({ label: 'Family considerations', text: d.familyNotes });
  return out;
}

// generateRebalancing is defined earlier with full priority-aware logic

function generateSolution(client) {
  const d = client.discovery;
  const buckets = bucketGoals(d.goals);
  const capacity = computeCapacity(d);
  const reconciliation = reconcileRisk(d.statedRisk, capacity);
  const bindingLabel = reconciliation.bindingLabel;

  const bucketOutputs = {};
  ['short','medium','long'].forEach(b => {
    if (!buckets[b].length) return;
    const allocResult = priorityAwareAllocation(b, buckets[b], bindingLabel);
    bucketOutputs[b] = {
      goals: buckets[b],
      allocation: allocResult.rows,
      rebalanceTrigger: allocResult.rebalanceTrigger,
      glide: allocResult.glide,
      instruments: instrumentsFor(b, d),
    };
  });

  return {
    generatedAt: Date.now(),
    buckets: bucketOutputs,
    capacity,
    reconciliation,
    constraints: generateConstraints(d),
    rebalancing: generateRebalancing(buckets),
    advisorOverrideNote: '',
  };
}

/* ============================================================
   RENDERING
============================================================ */
function esc(s) { return (s ?? '').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function inr(n) { n = Number(n)||0; return '₹' + n.toLocaleString('en-IN'); }

const STAGES = [
  { n: 1, label: 'Relationship Manager', sub: 'Who is handling this client' },
  { n: 2, label: 'Client Discovery', sub: 'Goals, risk, constraints — no products yet' },
  { n: 3, label: 'Solutions', sub: 'Build the IPS & allocation' },
  { n: 4, label: 'Recommendation', sub: 'Present and justify the plan' },
];

function render() {
  renderSpine();
  renderMain();
}

function renderSpine() {
  document.getElementById('firmname').textContent = app.firm.name || 'Unnamed Firm';
  document.getElementById('firmtag').textContent = app.firm.philosophy
    ? (app.firm.philosophy.length > 90 ? app.firm.philosophy.slice(0,88) + '…' : app.firm.philosophy)
    : 'Set your firm profile in Settings.';

  const sel = document.getElementById('clientSelect');
  const ids = Object.keys(app.clients).sort((a,b) => (app.clients[b].createdAt||0)-(app.clients[a].createdAt||0));
  sel.innerHTML = ids.length ? '' : '<option value="">No clients yet</option>';
  ids.forEach(id => {
    const c = app.clients[id];
    const opt = document.createElement('option');
    opt.value = id; opt.textContent = c.name + (c.finalized ? ' ✓' : '');
    if (id === app.currentClientId) opt.selected = true;
    sel.appendChild(opt);
  });
  sel.onchange = (e) => app.selectClient(e.target.value);

  const list = document.getElementById('stagelist');
  const c = app.clients[app.currentClientId];
  const inSettings = app.currentStage === 'settings';
  list.innerHTML = STAGES.map(s => {
    const locked = !c;
    const active = !inSettings && s.n === app.currentStage;
    const done = c && ((s.n === 1 && c.rm && c.rm.name) || (s.n === 2 && c.discovery.goals.some(g=>g.name)) || (s.n === 3 && c.solution) || (s.n === 4 && c.finalized));
    return `<li class="${active?'active':''} ${done && !active ? 'done':''} ${locked?'locked':''}" onclick="${locked?'':'app.goToStage('+s.n+')'}">
      <span class="num">${String(s.n).padStart(2,'0')}</span>
      <span><span class="label">${s.label}</span><span class="sub">${s.sub}</span></span>
    </li>`;
  }).join('');
}

function renderMain() {
  const main = document.getElementById('main');
  const c = app.clients[app.currentClientId];
  if (app.currentStage === 'settings') { main.innerHTML = viewSettings(); wireSettings(); return; }
  if (!c) { main.innerHTML = emptyState(); return; }
  if (app.currentStage === 1) { main.innerHTML = viewStage1(c); wireStage1(c); return; }
  if (app.currentStage === 2) { main.innerHTML = viewStage2(c); wireStage2(c); return; }
  if (app.currentStage === 3) { main.innerHTML = viewStage3(c); wireStage3(c); return; }
  if (app.currentStage === 4) { main.innerHTML = viewStage4(c); wireStage4(c); return; }
}

function emptyState() {
  return `<div class="empty-state"><h3>No client selected</h3><p>Create a new client file from the sidebar to begin. You can also set up your Firm Profile and default Relationship Manager details under Settings.</p></div>`;
}

function wireStage2(c) {
  const bind = (id, field, checkbox) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.oninput = el.onchange = () => app.setDiscovery(field, checkbox ? el.checked : el.value);
  };
  document.getElementById('d_name').oninput = e => { c.name = e.target.value; scheduleSave(); renderSpine(); };
  bind('d_age', 'age'); bind('d_occ', 'occupation');
  bind('d_income', 'monthlyIncome'); bind('d_expenses', 'monthlyExpenses'); bind('d_debt', 'monthlyDebt');
  bind('d_dep', 'dependents'); bind('d_depnotes', 'dependentNotes');
  bind('d_assets', 'assets'); bind('d_liab', 'liabilities');
  bind('d_liq', 'liquidityBuffer'); bind('d_incstab', 'incomeStability');
  bind('d_neartermchk', 'nearTermCashNeed', true); bind('d_nearnotes', 'nearTermNotes');
  bind('d_insurchk', 'insuranceGap', true); bind('d_insurnotes', 'insuranceNotes');

  // FIX #3: Validate risk tolerance input
  const riskSelect = document.getElementById('d_risk');
  if (riskSelect) {
    riskSelect.onchange = (e) => {
      const validRisks = ['low', 'moderate', 'high'];
      if (!validRisks.includes(e.target.value)) {
        toast('Risk tolerance must be Low, Moderate, or High.');
        e.target.value = c.discovery.statedRisk || 'moderate';
        return;
      }
      app.setDiscovery('statedRisk', e.target.value);
    };
  }

  bind('d_tax', 'taxRegime'); bind('d_risknotes', 'riskNotes');
  bind('d_constraints', 'constraints'); bind('d_family', 'familyNotes'); bind('d_other', 'otherNotes');

  document.querySelectorAll('#goalRows input').forEach(inp => {
    inp.oninput = () => app.setGoalField(Number(inp.dataset.goal), inp.dataset.key, inp.value);
  });
}

/* ---------------- Stage 3 ---------------- */
const BUCKET_LABEL = { short: 'Short-term (0–3 yrs)', medium: 'Medium-term (3–8 yrs)', long: 'Long-term (8+ yrs)' };

function viewStage3(c) {
  const s = c.solution;
  const cap = s.capacity, rec = s.reconciliation;

  const bucketsHtml = Object.keys(s.buckets).map(bKey => {
    const b = s.buckets[bKey];
    const goalNames = b.goals.map(g => {
      const pri = g.priority ? ` · Priority: ${esc(g.priority)}` : '';
      return `<strong>${esc(g.name)}</strong> (${inr(g.amount)}, ${g.years}y${pri})`;
    }).join(' &nbsp;|&nbsp; ');

    const allocRows = b.allocation.map((a, i) => `
      <tr>
        <td>${esc(a.asset)}</td>
        <td><input type="text" data-bucket="${bKey}" data-alloc="${i}" data-key="range" value="${esc(a.range)}" style="width:90px"></td>
        <td><textarea data-bucket="${bKey}" data-alloc="${i}" data-key="rationale" rows="2">${esc(a.rationale)}</textarea></td>
      </tr>`).join('');

    const instrRows = b.instruments.map((ins, i) => `
      <tr>
        <td>${esc(ins.asset)}</td>
        <td><input type="text" data-bucket="${bKey}" data-instr="${i}" data-key="cat" value="${esc(ins.cat)}"></td>
        <td><textarea data-bucket="${bKey}" data-instr="${i}" data-key="why" rows="2">${esc(ins.why)}</textarea></td>
      </tr>`).join('');

    // Within-sleeve optimization metrics
    const ef = bucketFundWeights(b, 'equal').filter(f => f.weight > 0.001);
    const sf = bucketFundWeights(b, 'sharpe').filter(f => f.weight > 0.001);
    const cf = bucketFundWeights(b, 'calmar').filter(f => f.weight > 0.001);
    const es = portfolioStatsJS(ef), ss = portfolioStatsJS(sf), cs = portfolioStatsJS(cf);
    const hasEquity = b.allocation.some(a => a.asset === 'Equity' && allocRowPct(a) > 0.01);

    const optPanel = hasEquity ? `
      <div style="margin-top:14px;padding:12px;background:var(--paper-2);border-radius:var(--radius);font-size:12.5px">
        <strong>Equity sleeve optimisation</strong>
        <span class="hint" style="margin-left:8px">(8,000 random trials, 35% cap per fund)</span>
        <table class="ledger" style="margin-top:8px;font-size:12px">
          <tr>
            <th>Metric</th>
            <th style="text-align:right">Equal Wt</th>
            <th style="text-align:right;background:rgba(168,118,63,0.1)">Sharpe-Opt ★</th>
            <th style="text-align:right">Calmar-Opt</th>
          </tr>
          <tr>
            <td>Bucket Return (%)</td>
            <td style="text-align:right">${es.ret.toFixed(1)}</td>
            <td style="text-align:right;background:rgba(168,118,63,0.06)">${ss.ret.toFixed(1)}</td>
            <td style="text-align:right">${cs.ret.toFixed(1)}</td>
          </tr>
          <tr>
            <td>Std Dev (%)</td>
            <td style="text-align:right">${es.sd.toFixed(1)}</td>
            <td style="text-align:right;background:rgba(168,118,63,0.06)">${ss.sd.toFixed(1)}</td>
            <td style="text-align:right">${cs.sd.toFixed(1)}</td>
          </tr>
          <tr>
            <td>Est. Max Drawdown (%)</td>
            <td style="text-align:right;color:var(--rust)">${(es.maxDD*100).toFixed(1)}</td>
            <td style="text-align:right;background:rgba(168,118,63,0.06);color:var(--rust)">${(ss.maxDD*100).toFixed(1)}</td>
            <td style="text-align:right;color:var(--rust)">${(cs.maxDD*100).toFixed(1)}</td>
          </tr>
          <tr>
            <td>Sharpe Ratio</td>
            <td style="text-align:right">${es.sharpe.toFixed(2)}</td>
            <td style="text-align:right;background:rgba(168,118,63,0.06);font-weight:600">${ss.sharpe.toFixed(2)}</td>
            <td style="text-align:right">${cs.sharpe.toFixed(2)}</td>
          </tr>
          <tr>
            <td>Calmar Ratio</td>
            <td style="text-align:right">${es.calmar.toFixed(2)}</td>
            <td style="text-align:right;background:rgba(168,118,63,0.06)">${ss.calmar.toFixed(2)}</td>
            <td style="text-align:right;font-weight:600">${cs.calmar.toFixed(2)}</td>
          </tr>
        </table>
        <p class="hint" style="margin-top:6px">★ Sharpe-Opt = best return per unit of SD. Calmar-Opt = best return per unit of max drawdown (use for loss-averse clients). Adoption of either is the advisor's judgment — fund weights in Stage 4 will reflect the Sharpe-optimised mix unless overridden. Full comparison in Excel export.</p>
      </div>` : '';

    // Per-bucket rebalancing trigger from priority logic
    const rebTrigger = b.rebalanceTrigger || '±5% drift threshold';
    const glide = b.glide || '';

    return `
    <div class="bucket-block">
      <h4>${BUCKET_LABEL[bKey]} <span class="tag">${b.goals.length} goal${b.goals.length>1?'s':''}</span></h4>
      <p style="font-size:13px;margin-bottom:4px">${goalNames}</p>
      <div style="display:flex;gap:16px;margin-bottom:12px;flex-wrap:wrap">
        <span class="hint">📊 Rebalancing: <strong>${esc(rebTrigger)}</strong></span>
        ${glide ? `<span class="hint">📉 Glide path: ${esc(glide)}</span>` : ''}
      </div>
      <table class="ledger" style="margin-bottom:12px">
        <tr><th style="width:140px">Asset class</th><th style="width:100px">Target %</th><th>Rationale — why this allocation for this bucket (editable)</th></tr>
        ${allocRows}
      </table>
      <table class="ledger">
        <tr><th style="width:100px">Asset class</th><th style="width:200px">Instrument category</th><th>Why this instrument (editable)</th></tr>
        ${instrRows}
      </table>
      ${optPanel}
    </div>`;
  }).join('');

  const constraintsHtml = s.constraints.map((cn, i) => `
    <div class="field">
      <label>${esc(cn.label)}</label>
      <textarea data-constraint="${i}" rows="2">${esc(cn.text)}</textarea>
    </div>`).join('');

  // Build aggregated rebalancing summary from per-bucket triggers
  const bucketRebLines = Object.keys(s.buckets).map(bKey => {
    const b = s.buckets[bKey];
    const trig = b.rebalanceTrigger || '±5% drift threshold';
    return `<li><strong>${BUCKET_LABEL[bKey]}:</strong> ${esc(trig)}</li>`;
  }).join('');

  return `
  <div class="stage-head">
    <p class="stage-eyebrow">Stage 3 — ${esc(c.name)}</p>
    <h1 class="stage-title serif">Solutions</h1>
    <p class="stage-desc">Built from the client's discovery data. Every field is editable — treat this as a structured starting point for professional judgment. Allocation rationale, rebalancing triggers and optimisation metrics are all derived from the goals and risk profile above.</p>
  </div>

  <div class="card">
    <h3>Risk tolerance vs. risk capacity</h3>
    <div class="split-panel">
      <div>
        <p class="hint" style="margin-bottom:6px">Financial capacity score</p>
        <p style="font-size:28px;font-weight:600;margin:0 0 6px" class="serif">${cap.score}<span style="font-size:14px;color:var(--text-dim)"> / 100</span> — <span class="badge ${cap.label.toLowerCase()}">${cap.label}</span></p>
        <ul style="font-size:12.5px;color:var(--text-dim);padding-left:18px;margin:8px 0">
          ${cap.factors.map(f => `<li>${esc(f)}</li>`).join('')}
        </ul>
      </div>
      <div>
        <p class="hint" style="margin-bottom:6px">Binding constraint</p>
        <p style="font-size:20px;font-weight:600;margin:0 0 8px" class="serif">${rec.bindingLabel} <span style="font-size:12px;font-weight:400;color:var(--text-dim)">(${rec.which})</span></p>
        <div class="quote-pull">${esc(rec.explanation)}</div>
      </div>
    </div>
  </div>

  <div class="card">
    <h3>Asset allocation &amp; instrument selection, by goal bucket</h3>
    <p class="hint">Allocation percentages are derived from: binding risk label + each bucket's shortest goal horizon + goal priority. Equity ranges, rebalancing triggers and glide paths differ per bucket — see each bucket's own rationale below. Optimization metrics (Sharpe vs Calmar) are also shown per bucket.</p>
    ${bucketsHtml || '<p class="hint">No goals were bucketed — check discovery inputs.</p>'}
  </div>

  <div class="card">
    <h3>Constraints &amp; special considerations</h3>
    ${constraintsHtml}
  </div>

  <div class="card">
    <h3>Rebalancing policy</h3>
    <p class="hint">Triggers are set per bucket based on goal priority — Priority-1 goals use a ±3% drift threshold, others use ±5%. These are shown in each bucket above and summarised here.</p>
    <ul style="font-size:13px;padding-left:18px;margin-bottom:12px">${bucketRebLines}</ul>
    <div class="field"><label>Overall trigger &amp; cadence (editable)</label><textarea id="reb_trigger" rows="2">${esc(s.rebalancing.trigger)}</textarea></div>
    <div class="field"><label>Why this cadence fits this client</label><textarea id="reb_fit" rows="2">${esc(s.rebalancing.fit)}</textarea></div>
    <div class="field"><label>Glide-path &amp; milestone policy</label><textarea id="reb_glide" rows="2">${esc(s.rebalancing.glide)}</textarea></div>
  </div>

  <div class="card">
    <h3>Advisor override notes</h3>
    <p class="hint">Anything the rules-engine draft above doesn't capture — professional judgment calls, exceptions, context.</p>
    <textarea id="advisorNote" rows="3">${esc(s.advisorOverrideNote)}</textarea>
  </div>

  <div class="actions">
    <button class="ghost" onclick="app.regenerateDraft()">↻ Regenerate draft from discovery</button>
    <div style="flex:1"></div>
    <button class="primary" onclick="app.finalizeSolution()">Finalize & Continue to Recommendation →</button>
  </div>`;
}

function wireStage3(c) {
  const s = c.solution;
  document.querySelectorAll('[data-alloc]').forEach(el => {
    el.oninput = () => {
      const b = el.dataset.bucket, idx = Number(el.dataset.alloc), key = el.dataset.key;
      s.buckets[b].allocation[idx][key] = el.value;
      scheduleSave();
    };
  });
  document.querySelectorAll('[data-instr]').forEach(el => {
    el.oninput = () => {
      const b = el.dataset.bucket, idx = Number(el.dataset.instr), key = el.dataset.key;
      s.buckets[b].instruments[idx][key] = el.value;
      scheduleSave();
    };
  });
  document.querySelectorAll('[data-constraint]').forEach(el => {
    el.oninput = () => { s.constraints[Number(el.dataset.constraint)].text = el.value; scheduleSave(); };
  });
  document.getElementById('reb_trigger').oninput = e => { s.rebalancing.trigger = e.target.value; scheduleSave(); };
  document.getElementById('reb_fit').oninput = e => { s.rebalancing.fit = e.target.value; scheduleSave(); };
  document.getElementById('reb_glide').oninput = e => { s.rebalancing.glide = e.target.value; scheduleSave(); };
  document.getElementById('advisorNote').oninput = e => { s.advisorOverrideNote = e.target.value; scheduleSave(); };
}

/* ---------------- Stage 4 ---------------- */
function blendedAllocation(s) {
  // Simple weighted average across buckets (equal weight per bucket present) purely for the headline chart.
  const totals = { Equity: 0, Debt: 0, Gold: 0, 'Cash / Liquid': 0, Alternatives: 0 };
  let n = 0;
  Object.values(s.buckets).forEach(b => {
    n++;
    b.allocation.forEach(a => {
      const nums = (a.range.match(/[\d.]+/g) || [0]).map(Number);
      const mid = nums.length > 1 ? (nums[0]+nums[1])/2 : nums[0];
      if (totals[a.asset] !== undefined) totals[a.asset] += mid;
    });
  });
  if (n) Object.keys(totals).forEach(k => totals[k] = totals[k]/n);
  return totals;
}

function defenseTalkTrack(c) {
  const d = c.discovery, s = c.solution, points = [];
  points.push({ quote: 'Stated risk tolerance: ' + d.statedRisk + (d.riskNotes ? ' — "' + d.riskNotes + '"' : ''),
    link: 'This is why the binding constraint is ' + s.reconciliation.bindingLabel + ' (' + s.reconciliation.which + ') rather than a generic moderate allocation.' });
  if (d.liquidityBuffer !== 'unknown') points.push({ quote: 'Liquidity buffer reported as ' + d.liquidityBuffer,
    link: d.liquidityBuffer === 'inadequate' ? 'This is why building an emergency fund is treated as a precondition in the constraints section.' : 'This supported a higher risk-capacity score.' });
  if (d.insuranceGap) points.push({ quote: 'Insurance gap: ' + (d.insuranceNotes || '(flagged)'),
    link: 'This is why closing insurance is listed as a precondition alongside — not after — the investment plan.' });
  d.goals.filter(g=>g.name).forEach(g => {
    points.push({ quote: g.name + ': ' + inr(g.amount) + ' in ' + g.years + ' years',
      link: 'This goal sits in the ' + (Number(g.years)<=3?'short-term':Number(g.years)<=8?'medium-term':'long-term') + ' bucket, which is why its allocation is ' + (Number(g.years)<=3?'debt-heavy for capital safety':Number(g.years)<=8?'a moderate equity/debt blend':'growth-oriented') + '.' });
  });
  if (d.constraints) points.push({ quote: 'Client preference: ' + d.constraints, link: 'This is reflected directly in the instrument choices above (see exclusions).' });
  return points;
}

function computeGoalFundingProjection(client, overrides) {
  overrides = overrides || {};
  const allGoals = [];
  Object.keys(client.solution.buckets).forEach(bKey => {
    client.solution.buckets[bKey].goals.forEach(g => {
      if (g.name && g.amount && g.years) allGoals.push({ name: g.name, amount: Number(g.amount), years: Number(g.years), bucket: bKey });
    });
  });
  if (!allGoals.length) return [];
  const maxHorizon = Math.max(...allGoals.map(g => g.years));
  const bucketReturns = {};
  Object.keys(client.solution.buckets).forEach(bKey => {
    const bf = bucketFundWeights(client.solution.buckets[bKey]).filter(f => f.weight > 0.001);
    bucketReturns[bKey] = overrides.bucketReturnAdj ? portfolioStatsJS(bf).ret + overrides.bucketReturnAdj : portfolioStatsJS(bf).ret;
  });
  const baseMonthlyIncome = Number(client.discovery.monthlyIncome)||0;
  const baseExpenses = Number(client.discovery.monthlyExpenses)||0;
  const baseDebt = Number(client.discovery.monthlyDebt)||0;
  const monthlySurplus = (baseMonthlyIncome + (overrides.extraIncome||0)) - (baseExpenses - (overrides.expenseCut||0)) - baseDebt;

  // FIX #5: Flag negative surplus early — return unmet with reason
  if (monthlySurplus <= 0) {
    return allGoals.map(g => ({
      name: g.name,
      bucket: g.bucket,
      years: g.years,
      target: g.amount * (overrides.targetScale || 1.0),
      balance: 0,
      met: false,
      yearsNeeded: Infinity,
      shortfall: g.amount,
      reason: 'Negative monthly surplus — monthly expenses exceed income. Reduce expenses or increase income to fund goals.'
    }));
  }

  // which goals are unmet at baseline (for prioritiseFactor re-weighting)
  const unmetNames = new Set(overrides.unmetNames || []);
  const salaryGrowth = overrides.salaryGrowth !== undefined ? overrides.salaryGrowth : 0.07;
  const horizonExt = overrides.horizonExtension || 0;
  const targetScale = overrides.targetScale || 1.0;
  const balances = {}; allGoals.forEach(g => balances[g.name] = 0);
  const lastContrib = {};
  let annualSurplus = monthlySurplus * 12;
  for (let y = 1; y <= maxHorizon; y++) {
    if (y > 1) annualSurplus *= (1 + salaryGrowth);
    const active = allGoals.filter(g => y <= g.years + horizonExt);
    const pf = overrides.prioritiseFactor || 1;
    const sumActiveAmt = active.reduce((s,g) => {
      const isUnmet = unmetNames.has(g.name);
      return s + g.amount * (isUnmet ? pf : 1);
    }, 0) || 1;
    active.forEach(g => {
      const isUnmet = unmetNames.has(g.name);
      const contrib = annualSurplus * g.amount * (isUnmet ? pf : 1) / sumActiveAmt;
      balances[g.name] = balances[g.name] * (1 + bucketReturns[g.bucket]/100) + contrib;
      lastContrib[g.name] = contrib;
    });
  }
  return allGoals.map(g => {
    const target = g.amount * targetScale;  // goal amount is already in future rupees — no inflation needed
    const balance = balances[g.name];
    const met = balance >= target;
    let yearsNeeded = g.years + horizonExt;
    if (!met) {
      const r = bucketReturns[g.bucket] / 100;
      const pmt = lastContrib[g.name] || 0;
      let bal = balance, yrs = g.years + horizonExt;
      while (bal < target && yrs < 100) { bal = bal * (1 + r) + pmt; yrs++; }
      yearsNeeded = yrs;
    }
    return { name: g.name, bucket: g.bucket, years: g.years + horizonExt, target, balance, met, yearsNeeded, shortfall: balance - target };
  });
}

function runUnmetGoalScenarios(client) {
  const baseline = computeGoalFundingProjection(client);
  const unmet = baseline.filter(g => !g.met);
  if (!unmet.length) return null;

  const LEVERS = [
    { label: "Baseline (no change)", overrides: {} },
    { label: "Prioritise unmet goal — 2x allocation weight", overrides: { prioritiseFactor: 2 } },
    { label: "Prioritise unmet goal — 3x allocation weight", overrides: { prioritiseFactor: 3 } },
    { label: "Cut monthly expenses by ₹10,000", overrides: { expenseCut: 10000 } },
    { label: "Add second income +₹15,000/mo", overrides: { extraIncome: 15000 } },
    { label: "Expenses -₹5k + Income +₹10k", overrides: { expenseCut: 5000, extraIncome: 10000 } },
    { label: "Extend each unmet goal's horizon by +2 yrs", overrides: { horizonExtension: 2 } },
    { label: "Reduce goal target to 80% (partial self-fund/loan/downscale)", overrides: { targetScale: 0.80 } },
    { label: "More aggressive bucket allocation (returns +2pp)", overrides: { bucketReturnAdj: 2 } },
    { label: "2x prioritise + expenses -₹5k + income +₹10k (combined)", overrides: { prioritiseFactor: 2, expenseCut: 5000, extraIncome: 10000 } },
    { label: "2x prioritise + target 85% (tightest realistic lever)", overrides: { prioritiseFactor: 2, targetScale: 0.85 } },
  ];

  const unmetNames = unmet.map(g => g.name);
  return { baseline, unmet, scenarios: LEVERS.map(lev => ({
    label: lev.label,
    results: computeGoalFundingProjection(client, Object.assign({ unmetNames }, lev.overrides)),
  })) };
}

        </div>`;

  const ctx = document.getElementById('allocChart');

function generateAssumptionsLog(d) {
  const items = [];
  if (d.liquidityBuffer === 'unknown') items.push("Liquidity buffer status was not confirmed during discovery — treated conservatively (as inadequate) in the risk-capacity score below until the client verifies otherwise.");
  if (d.taxRegime === 'unsure') items.push("Tax regime (old vs. new) was not confirmed — instrument selection in Section 4 assumes this will be verified with an actual computation before implementation.");
  if (!d.dependentNotes) items.push("No detail was given on dependents beyond the count provided; family-specific goals may need revisiting once known.");
  if (d.goals.some(g => g.name && !g.priority)) items.push("Goals without an explicit priority note from the client were ranked by time horizon (soonest deadline first) as a reasonable default, not a stated client preference.");
  if (!d.returnExpectation) items.push("No explicit return expectation was stated by the client; the allocation in Section 3 is built from risk capacity alone, not a target return.");
  if (!d.assets && !d.liabilities) items.push("Existing assets and liabilities were not itemised in discovery — net worth below is approximate.");
  if (items.length === 0) items.push("No material gaps were identified in the discovery notes; every figure below traces directly to client-provided information.");
  return items;
}

function goalPriorityMap(goals) {
  const named = goals.filter(g => g.name);
  const sorted = [...named].sort((a, b) => (Number(a.years)||99) - (Number(b.years)||99));
  const rank = {};
  sorted.forEach((g, i) => { rank[g.name + '|' + g.years] = i + 1; });
  return rank;
}

function bucketSplitExplanation(buckets) {
  const parts = [];
  if (buckets.short) parts.push(buckets.short.goals.length + ' short-term goal(s) (0–3 yrs)');
  if (buckets.medium) parts.push(buckets.medium.goals.length + ' medium-term goal(s) (3–8 yrs)');
  if (buckets.long) parts.push(buckets.long.goals.length + ' long-term goal(s) (8+ yrs)');
  return "Goals are bucketed by time horizon: " + parts.join(', ') + ". A goal's proximity determines how much capital-preservation weight its own bucket needs — this is why Section 3 presents a separate allocation per bucket rather than one blended number for the whole household.";
}

function exclusionsFor(bucketName, d) {
  const lowLit = /low literacy|simple|time-?poor|first[- ]time/i.test(d.constraints || '');
  const noDirectEq = /no direct equity|not direct equity|avoid direct equity/i.test(d.constraints || '');
  const excl = [];
  if (bucketName !== 'short' && (noDirectEq || lowLit)) {
    excl.push("direct equity / individual stock-picking (the client's stated preference or literacy level calls for simpler, index-based exposure instead)");
  }
  if (bucketName === 'short') {
    excl.push("any equity beyond the minimal allocation shown — capital preservation is the binding priority for money needed within 3 years");
  }
  excl.push("leveraged or derivative-based products (inconsistent with the risk capacity established in Section 2)");
  return excl.join('; ') + '.';
}

function constraintsForTemplate(s) {
  const byLabel = {};
  s.constraints.forEach(cn => { byLabel[cn.label] = (byLabel[cn.label] ? byLabel[cn.label] + ' ' : '') + cn.text; });
  const tax = byLabel['Tax'] || 'Tax regime not yet established with the client.';
  let liquidity = byLabel['Liquidity'] || '';
  if (byLabel['Near-term cash need']) liquidity += (liquidity ? ' ' : '') + byLabel['Near-term cash need'];
  if (byLabel['Insurance']) liquidity += (liquidity ? ' ' : '') + byLabel['Insurance'];
  let legal = 'Nomination, will and estate documentation status was not confirmed during discovery — recommend addressing this alongside the investment plan.';
  if (byLabel['Client-stated preferences']) legal += ' Client preference: ' + byLabel['Client-stated preferences'];
  if (byLabel['Family considerations']) legal += ' Family considerations: ' + byLabel['Family considerations'];
  return { tax, liquidity: liquidity || 'No specific liquidity constraint flagged.', legal };
}

function buildIPSHtmlDoc(c) {
  const d = c.discovery, s = c.solution;
  const preparedBy = (c.rm.name || app.firm.name || '') + (c.rm.designation ? ', ' + c.rm.designation : '') + (app.firm.name && c.rm.name ? ' — ' + app.firm.name : '') + ' / ' + new Date().toLocaleDateString('en-IN');
  const netWorth = [d.assets, d.liabilities ? 'Liabilities: ' + d.liabilities : ''].filter(Boolean).join(' | ') || 'Not established';

  const assumptions = generateAssumptionsLog(d);
  const assumptionsHtml = '<ol>' + assumptions.map(a => '<li>' + esc(a) + '</li>').join('') + '</ol>';

  const rankMap = goalPriorityMap(d.goals);
  const goalRows = d.goals.filter(g => g.name).map(g => {
    const rank = g.priority || ('#' + rankMap[g.name + '|' + g.years] + ' (by horizon)');
    return `<tr><td>${esc(g.name)}</td><td>${inr(g.amount)}</td><td>${esc(g.years)} yrs</td><td>${esc(rank)}</td></tr>`;
  }).join('');

  const bucketAllocSections = Object.keys(s.buckets).map(bKey => {
    const b = s.buckets[bKey];
    const rows = b.allocation.map(a => `<tr><td>${esc(a.asset)}</td><td>${esc(a.range)}</td><td>${esc(a.rationale)}</td></tr>`).join('');
    return `<h3>${BUCKET_LABEL[bKey]}</h3>
      <table border="1" cellpadding="6" style="border-collapse:collapse;width:100%">
        <tr><th>Asset Class</th><th>Target % / Range</th><th>Rationale</th></tr>${rows}
      </table>`;
  }).join('');

  const bucketInstrSections = Object.keys(s.buckets).map(bKey => {
    const b = s.buckets[bKey];
    const rows = b.instruments.map(ins => `<tr><td>${esc(ins.asset)}</td><td>${esc(ins.cat)}</td><td>${esc(ins.why)}</td></tr>`).join('');
    return `<h3>${BUCKET_LABEL[bKey]}</h3>
      <table border="1" cellpadding="6" style="border-collapse:collapse;width:100%">
        <tr><th>Asset Class</th><th>Instrument Category</th><th>Why This Instrument, For This Client</th></tr>${rows}
      </table>
      <p><em>Deliberately excluding:</em> ${esc(exclusionsFor(bKey, d))}</p>`;
  }).join('');

  const cft = constraintsForTemplate(s);

  return `<!DOCTYPE html><html><head><meta charset="utf-8"><title>IPS — ${esc(c.name)}</title></head>
  <body style="font-family:Calibri,Arial,sans-serif;font-size:11pt;color:#111">
  <h1>Investment Policy Statement</h1>

  <h2>Client Snapshot</h2>
  <table border="1" cellpadding="6" style="border-collapse:collapse;width:100%">
    <tr><th style="width:35%;text-align:left">Field</th><th style="text-align:left">Details</th></tr>

    <tr><td>Approx. net worth / assets</td><td>${esc(netWorth)}</td></tr>

  </table>

  <h2>Assumptions Log</h2>
  <p><em>Facts not given in the brief that had to be assumed:</em></p>
  ${assumptionsHtml}

  <h2>1. Client Goals and Time Horizons</h2>
  <table border="1" cellpadding="6" style="border-collapse:collapse;width:100%">
    <tr><th>Goal</th><th>Est. Amount (₹)</th><th>Time Horizon</th><th>Priority Rank</th></tr>
    ${goalRows}
  </table>
  <p><strong>Short / medium / long-term split:</strong> ${esc(bucketSplitExplanation(s.buckets))}</p>

  <h2>2. Risk Tolerance (Behavioural) and Risk Capacity (Financial)</h2>
  <p><strong>Risk tolerance —</strong> the client's stated comfort with volatility is <strong>${esc(d.statedRisk)}</strong>. ${esc(d.riskNotes) || "No further detail was given in the client's own words."}</p>
  <p><strong>Risk capacity —</strong> independent of what the client says, their finances can absorb a <strong>${s.capacity.label}</strong> level of risk (score ${s.capacity.score}/100). ${s.capacity.factors.map(esc).join(' ')}</p>

  ${s.advisorOverrideNote ? '<h2>Advisor Notes (supplementary — not part of the six required sections)</h2><p>' + esc(s.advisorOverrideNote) + '</p>' : ''}

}

app.exportIPS = async function() {
  const c = app.clients[app.currentClientId];
  const htmlStr = buildIPSHtmlDoc(c);
  if (!window.htmlDocx) { toast('Word export library did not load — try again.'); return; }
  const blob = htmlDocx.asBlob(htmlStr);
  const filename = 'IPS_' + c.name.replace(/[^a-z0-9]+/gi, '_') + '.docx';
  await saveBlob(blob, filename);
};

const EQUITY_SPLIT = [
  { cat: "Large Cap", pct: 0.35 },
  { cat: "Small Cap", pct: 0.15 },

  { cat: "International", pct: 0.15 },

function bucketTotalAmount(bucket) {
  return bucket.goals.reduce((sum, g) => sum + (Number(g.amount) || 0), 0);
}

function allocRowPct(allocRow) {
  const nums = (allocRow.range.match(/[\d.]+/g) || [0]).map(Number).map(n => Math.min(n, 100)); // FIX #4: Clamp to 100%
  return (nums.length > 1 ? (nums[0] + nums[1]) / 2 : nums[0]) / 100;
}

// Maps ONE bucket's allocation into named-fund weights, normalized to 100% within that bucket
function bucketFundWeights(bucket, weightMode) {
  // weightMode: 'equal' (default) | 'sharpe' | 'calmar'
  const fundWeight = {};
  FUND_UNIVERSE.forEach(f => fundWeight[f[0]] = 0);
  const equityFundsCollected = [];
  bucket.allocation.forEach(row => {
    const pct = allocRowPct(row);
    if (row.asset === "Equity") {
      EQUITY_SPLIT.forEach(seg => {
        const fundsInCat = FUND_UNIVERSE.filter(f => f[1] === seg.cat);
        const segPct = pct * seg.pct;
        if (weightMode === 'equal' || !weightMode) {
          fundsInCat.forEach(f => fundWeight[f[0]] += segPct / fundsInCat.length);
        } else {
          // Collect equity funds for optimization (carry their sleeve pct)
          fundsInCat.forEach(f => equityFundsCollected.push({ name: f[0], sleevePct: segPct }));
        }
      });
    } else if (row.asset === "Debt") {
      fundWeight["ICICI Prudential All Seasons Bond Fund"] += pct;
    } else if (row.asset === "Gold") {
      fundWeight["SBI Gold Fund"] += pct;
    } else if (row.asset === "Cash / Liquid") {
      fundWeight["ICICI Prudential Liquid Fund"] += pct;
    } else if (row.asset === "Alternatives") {
      fundWeight["Ampersand AIF (Cat III, Multi-cap Long-Short)"] += pct;
    }
  });

  // Run optimizer on equity sleeve
  if ((weightMode === 'sharpe' || weightMode === 'calmar') && equityFundsCollected.length) {
    const totalEquityPct = equityFundsCollected.reduce((s, x) => s + x.sleevePct, 0);
    const uniqueNames = [...new Set(equityFundsCollected.map(x => x.name))];
    const eqFunds = uniqueNames.map(name => {
      const fu = FUND_UNIVERSE.find(f => f[0] === name);
      return { name: fu[0], category: fu[1], bmcat: fu[2], ret: fu[3], beta: fu[4], sd: fu[5], weight: 1/uniqueNames.length };
    });
    const optResult = optimizeSleeve(eqFunds);
    const optWeights = weightMode === 'sharpe' ? optResult.sharpeWeight : optResult.calmarWeight;
    eqFunds.forEach((f, i) => { fundWeight[f.name] += totalEquityPct * optWeights[i]; });
  }

  const total = Object.values(fundWeight).reduce((a, b) => a + b, 0) || 1;
  return FUND_UNIVERSE.map(f => ({
    name: f[0], category: f[1], bmcat: f[2], ret: f[3], beta: f[4], sd: f[5],
    weight: fundWeight[f[0]] / total,
  }));
}

// Return optimized metrics for all three modes in one pass (used in Stage 4 and Excel)
function bucketOptResults(bucket) {
  const totalEquityPct = bucket.allocation
    .filter(r => r.asset === 'Equity')
    .reduce((s, r) => s + allocRowPct(r), 0);
  const uniqueEqNames = [];
  EQUITY_SPLIT.forEach(seg => {
    FUND_UNIVERSE.filter(f => f[1] === seg.cat).forEach(f => {
      if (!uniqueEqNames.includes(f[0])) uniqueEqNames.push(f[0]);
    });
  });
  if (!uniqueEqNames.length || totalEquityPct < 0.01) return null;
  const eqFunds = uniqueEqNames.map(name => {
    const fu = FUND_UNIVERSE.find(f => f[0] === name);
    return { name: fu[0], category: fu[1], bmcat: fu[2], ret: fu[3], beta: fu[4], sd: fu[5], weight: 1/uniqueEqNames.length };
  });
  const opt = optimizeSleeve(eqFunds);
  return { funds: eqFunds, opt, totalEquityPct };
}

// Consolidated household weights
function mapClientToFunds(client, weightMode) {
  const s = client.solution;
  const bucketKeys = Object.keys(s.buckets);
  const grandTotal = bucketKeys.reduce((sum, k) => sum + bucketTotalAmount(s.buckets[k]), 0) || 1;
  const consolidated = {};
  FUND_UNIVERSE.forEach(f => consolidated[f[0]] = 0);
  bucketKeys.forEach(bKey => {
    const bucket = s.buckets[bKey];
    const share = bucketTotalAmount(bucket) / grandTotal;
    if (share <= 0) return;
    bucketFundWeights(bucket, weightMode).forEach(f => { consolidated[f.name] += f.weight * share; });
  });
  return FUND_UNIVERSE.map(f => ({
    name: f[0], category: f[1], bmcat: f[2], ret: f[3], beta: f[4], sd: f[5],
    weight: consolidated[f[0]],
    maxDD: fundMaxDrawdown({ beta: f[4], bmcat: f[2] }),
  }));
}

function encCell(r, c) { return XLSX.utils.encode_cell({ r, c }); }
function encCol(c) { return XLSX.utils.encode_col(c); }
function setV(ws, r, c, v, z) { const ref = encCell(r, c); ws[ref] = { t: typeof v === 'number' ? 'n' : 's', v }; if (z) ws[ref].z = z; }
function setF(ws, r, c, f, z) { const ref = encCell(r, c); ws[ref] = { t: 'n', f }; if (z) ws[ref].z = z; }
function growRange(ws, r, c) {
  const ref = XLSX.utils.decode_range(ws['!ref'] || 'A1:A1');
  if (r > ref.e.r) ref.e.r = r;
  if (c > ref.e.c) ref.e.c = c;
  ws['!ref'] = XLSX.utils.encode_range(ref);
}
function setCell(ws, r, c, v, opts) {
  opts = opts || {};
  const ref = encCell(r, c);
  if (typeof v === 'string' && v.startsWith('=')) {
    ws[ref] = { t: 'n', f: v.slice(1) };
  } else if (typeof v === 'number') {
    ws[ref] = { t: 'n', v };
  } else {
    ws[ref] = { t: 's', v: String(v) };
  }
  if (opts.z) ws[ref].z = opts.z;
  growRange(ws, r, c);
}
