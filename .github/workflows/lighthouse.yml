name: Lighthouse CI

# Audits a production build of the PR, served locally on the runner.
# It used to wait for the Vercel preview, but previews sit behind Vercel login,
# and the wait step never found a deployment ("no vercel deployment found").

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'project/nextjs-template/**'
      - '.github/workflows/lighthouse.yml'

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project/nextjs-template
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID || 'f36piw8r' }}
      NEXT_PUBLIC_SANITY_DATASET: ${{ vars.NEXT_PUBLIC_SANITY_DATASET || 'production' }}
      NEXT_PUBLIC_SITE_URL: https://cybereyeintelligence.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: project/nextjs-template/package-lock.json

      - name: Install dependencies
        run: npm ci

      # next/font downloads Google Fonts at build time and that download fails now and then
      # ("Cannot read properties of null (reading '1')"). One retry clears it.
      - name: Build
        run: npm run build || (echo "Build failed, retrying once in 20s" && sleep 20 && npm run build)

      - name: Run Lighthouse CI
        run: npx --yes @lhci/cli@0.14.0 autorun --config=lighthouserc.js

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: project/nextjs-template/.lighthouseci
          if-no-files-found: ignore
          # .lighthouseci is a dot-folder; upload-artifact v4 skips those unless told otherwise.
          include-hidden-files: true
